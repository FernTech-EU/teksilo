[package]
name = "new-widgets-kit"
edition = "2024"
version.workspace = true
license-file.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "new-widgets-kit"
path = "src/main.rs"

[dependencies]
# `file-dialog` is on by default (RfdAsyncBackend) — explicit here to
# document the dependency for the FilePickerField demo.
teksilo = { workspace = true, features = [
    "automation","file-dialog"] }
