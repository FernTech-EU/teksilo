[package]
name = "live-image-bench"
edition = "2024"
version.workspace = true
authors.workspace = true
publish = false

[features]
# The idle trace's live-pass timings, which `tools/live_image_measure.py`
# reads: build with `--release --features live-image-timings`.
live-image-timings = ["teksilo/live-image-timings"]

[dependencies]
teksilo = { workspace = true }
