[package]
name = "web-view-demo"
edition = "2024"
version.workspace = true
license-file.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "web-view-demo"
path = "src/main.rs"

# By default the demo installs the inert no-op backend (renders nothing). To
# run against a real engine:
#   cargo run -p web-view-demo --features wry     # wry (macOS / Windows / Linux-X11)
#   cargo run -p web-view-demo --features servo   # wry + Servo; Servo used on Wayland,
#                                                 # wry on X11 / macOS / Windows
[features]
default = []
wry = ["bastyde/web-view-wry"]
# `servo` is additive — bastyde/web-view-servo implies web-view-wry, so this
# ships both engines and the runtime picks Servo only under a Wayland session.
servo = ["bastyde/web-view-servo"]

[dependencies]
bastyde = { workspace = true, features = ["web-view"] }
