[package]
name = "web-view-demo"
edition = "2024"
version.workspace = true
license-file.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "web-view-demo"
path = "src/main.rs"

# By default the demo installs the headless backend (no page renders). To run
# against a real engine:
#   cargo run -p web-view-demo --features wry     # macOS / Windows / Linux-X11
#   cargo run -p web-view-demo --features servo   # Linux / Wayland (best-effort)
[features]
default = []
wry = ["bastyde/web-view-wry"]
servo = ["bastyde/web-view-servo"]

[dependencies]
bastyde = { workspace = true, features = ["web-view"] }
