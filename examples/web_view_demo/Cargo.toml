[package]
name = "web-view-demo"
edition = "2024"
version.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "web-view-demo"
path = "src/main.rs"

# The demo depends on `teksilo/web-view`, which is wry by default — so a plain
# `cargo run -p web-view-demo` renders via wry (macOS / Windows / Linux-X11).
# Add the Wayland fallback with:
#   cargo run -p web-view-demo --features servo   # wry + Servo; Servo on Wayland
[features]
default = []
# `servo` is additive — `teksilo/web-view-servo` implies `web-view` (wry), so
# this ships both engines and the runtime picks Servo only under Wayland.
servo = ["teksilo/web-view-servo"]

[dependencies]
teksilo = { workspace = true, features = [
    "automation","web-view"] }
