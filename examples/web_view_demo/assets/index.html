<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Teksilo WebView demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #fafafa;
        color: #222;
      }
      #counter {
        font-size: 4rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      button {
        font-size: 1rem;
        padding: 0.5rem 1rem;
        margin-top: 1rem;
      }
      #log {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Teksilo WebView</h1>

    <!-- The counter increments on a timer. Tab away in the host app and back:
         on return it continues from where it was — proof the native subview
         was hidden, not reloaded. -->
    <div>Counter (proves "hidden, not reloaded"):</div>
    <div id="counter">0</div>

    <!-- JS → Rust: posts a message the host appends to its log pane. -->
    <button onclick="sendHello()">Send message to Rust</button>

    <!-- Rust → JS: the host dispatches a 'teksilo-message' event we display. -->
    <div id="log"></div>

    <script>
      let n = 0;
      setInterval(() => {
        n += 1;
        document.getElementById("counter").textContent = n;
      }, 1000);

      function sendHello() {
        if (window.ipc && window.ipc.postMessage) {
          window.ipc.postMessage(
            JSON.stringify({ type: "hello", data: Date.now() })
          );
        }
      }

      window.addEventListener("teksilo-message", (e) => {
        const log = document.getElementById("log");
        log.textContent += "From Rust: " + JSON.stringify(e.data) + "\n";
      });
    </script>
  </body>
</html>
