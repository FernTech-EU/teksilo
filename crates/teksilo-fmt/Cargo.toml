[package]
name = "teksilo-fmt"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Formatter engine for teksu! DSL blocks in Rust source files — the library behind cargo-teksilo-fmt."
documentation = "https://docs.rs/teksilo-fmt"
keywords = ["formatter", "dsl", "teksu", "source-code", "rustfmt"]
categories = ["development-tools", "text-processing"]

[dependencies]
teksilo-parse = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "3", features = ["full", "extra-traits", "visit"] }
thiserror = { workspace = true }

[package.metadata.docs.rs]
all-features = true
