[package]
name = "bastyde-webview"
description = "Embeddable WebView widget for Bastyde — pluggable native engine backend (wry / Servo) behind a Bastyde-native widget."
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bastyde-core = { workspace = true }
bastyde-tokens = { workspace = true }
bastyde-canvas = { workspace = true }

# --- Native engine backends (opt-in) ---
# Kept OFF by default so a plain workspace `cargo build` / `cargo test`
# stays light and green without pulling a browser engine. The umbrella
# `bastyde` crate's `web-view` feature selects the right one per platform.
#
# wry 0.55.1 (winit-0.30 compatible) is the production backend on
# macOS / Windows / Linux-X11; servo 0.2.0 is the best-effort Wayland
# backend. The dependency lines are scaffolded but commented until the
# spike verifies the embedding round-trip — see `src/wry_backend.rs`.
# wry = { version = "0.55.1", optional = true }
# servo = { version = "0.2.0", optional = true }

[features]
default = []
# Enable once the wry dependency above is uncommented and the spike
# (parent-handle round-trip into `build_as_child`) is verified.
wry-backend = []
# Enable once the servo dependency above is uncommented.
servo-backend = []

[dev-dependencies]
bastyde-core = { workspace = true }
# Used by the lifecycle tests to park a WebView in a real `Switcher` and
# assert the dormancy → set_visible(false/true) bridge. Dev-only; the crate
# itself stays free of any widget-catalog dependency.
bastyde-widgets = { workspace = true }
bastyde-canvas = { workspace = true }
