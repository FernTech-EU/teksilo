[package]
name = "fern-analytics-fern"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "FernUI analytics adapter for the home-grown gRPC `fern-collector` backend. Sub-phase A: localhost ingest, no auth, no TLS."

[dependencies]
fern-core = { workspace = true }
fern-telemetry = { workspace = true }
fern-collector-proto = { workspace = true }

# gRPC + tokio — kept local to this crate. No other fern-ui crate
# uses them, so promoting them to workspace deps would leak the
# transport choice to everyone.
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport", "tls"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
fern-settings = { workspace = true }
