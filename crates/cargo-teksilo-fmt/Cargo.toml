[package]
name = "cargo-teksilo-fmt"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Formatter for teksu! DSL blocks in Rust source files"
documentation = "https://docs.rs/cargo-teksilo-fmt"
keywords = ["formatter", "cargo-subcommand", "dsl", "teksu", "rustfmt"]
categories = ["development-tools::cargo-plugins", "development-tools"]

[[bin]]
name = "cargo-teksilo-fmt"
path = "src/main.rs"

[dependencies]
teksilo-fmt = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
