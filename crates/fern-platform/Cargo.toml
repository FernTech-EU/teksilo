[package]
name = "fern-platform"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fern-tokens = { workspace = true }
fern-core = { workspace = true }
fern-canvas = { workspace = true }
fern-render = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = "0.32"
arboard = { workspace = true, optional = true }

[features]
default = []
# Chains through `fern-app/clipboard` → `fern-ui/clipboard`. Apps
# enabling this feature get `ClipboardHandle` auto-installed into
# the app-state registry during `FernAppBuilder::run`, reachable
# from widgets via `EventContext::app_state::<ClipboardHandle>()`.
clipboard = ["dep:arboard"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSAccessibility",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSGraphics",
    "NSButton",
    "NSControl",
] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "UI_ViewManagement",
] }
