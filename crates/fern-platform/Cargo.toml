[package]
name = "fern-platform"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fern-tokens = { workspace = true }
fern-core = { workspace = true }
fern-canvas = { workspace = true }
fern-render = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = "0.32"
arboard = { workspace = true, optional = true }
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
], optional = true }
async-std = { version = "1", optional = true }

[features]
default = []
# Chains through `fern-app/clipboard` → `fern-ui/clipboard`. Apps
# enabling this feature get `ClipboardHandle` auto-installed into
# the app-state registry during `FernAppBuilder::run`, reachable
# from widgets via `EventContext::app_state::<ClipboardHandle>()`.
clipboard = ["dep:arboard"]

# Defines the FileDialog trait surface (FileDialogBackend trait,
# FileDialogHandle, FileDialogRequest, FileDialogResult,
# FileDialogEventPayload, MemoryFileDialog). No external runtime
# deps beyond fern-core. Lets a host app ship its own backend
# without paying for rfd. Apps that want native dialogs enable
# `rfd-backend` instead, which implies this feature.
file-dialog = []

# Adds `RfdAsyncBackend` — a native-dialog adapter backed by the
# `rfd` crate plus an `async-std` worker pool to drive its futures
# off the UI thread. Implies `file-dialog`.
rfd-backend = ["file-dialog", "dep:rfd", "dep:async-std"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSAccessibility",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSGraphics",
    "NSButton",
    "NSControl",
] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "UI_ViewManagement",
] }
