[package]
name = "fern-platform"
edition = "2024"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fern-tokens = { workspace = true }
fern-core = { workspace = true }
fern-canvas = { workspace = true }
fern-render = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = "0.32"
arboard = { workspace = true, optional = true }

[features]
default = []
# M8a: the `clipboard` feature is declared but not chained to any
# other crate yet. M8b will wire it into `fern-widgets/rich-text`
# and `fern-app/rich-text` so the editor preset's cut/paste
# command dispatch receives a real `ClipboardHandle` instead of
# the M8a no-op. Until then, enabling it by itself pulls in
# `arboard` and exposes `ArboardClipboard` for apps that want
# the system clipboard for other widgets.
clipboard = ["dep:arboard"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSAccessibility"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "UI_ViewManagement",
] }
