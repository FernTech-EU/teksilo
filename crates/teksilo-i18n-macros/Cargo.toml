[package]
name = "teksilo-i18n-macros"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compile-time tr! / tr_signal! localization macros for Teksilo, with .ftl validation at build time."
documentation = "https://docs.rs/teksilo-i18n-macros"
keywords = ["i18n", "fluent", "macros", "proc-macro", "localization"]
categories = ["internationalization", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
fluent-syntax = { workspace = true }

[package.metadata.docs.rs]
all-features = true
