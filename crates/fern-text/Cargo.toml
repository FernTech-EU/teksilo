[package]
name = "fern-text"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Default set: Latin/Cyrillic/Greek via Inter (always embedded), plus
# Arabic and Hebrew fallback bundles so the internationalization demo
# and common RTL cases work out of the box. Applications shipping a
# Latin-only UI can opt out with `default-features = false`.
default = ["fonts-arabic", "fonts-hebrew"]

# Per-script fallback fonts. Each enables an `include_bytes!` of one
# variable-weight Noto Sans font at compile time, registered with the
# typesetter in `register_default_font` so text-typeset's automatic
# `.notdef` fallback loop can cover mixed-script text without any
# locale awareness.
fonts-arabic = []
fonts-hebrew = []
# Defined but the font files are not yet in the fonts/ directory.
# Enable one of these features and the build will fail loudly with a
# missing-file error, making it obvious to drop the file in place.
fonts-thai = []
fonts-devanagari = []
fonts-cjk-sc = []
fonts-cjk-jp = []
fonts-cjk-kr = []

# Convenience meta-features.
fonts-all-non-cjk = [
    "fonts-arabic",
    "fonts-hebrew",
    "fonts-thai",
    "fonts-devanagari",
]
fonts-all = [
    "fonts-all-non-cjk",
    "fonts-cjk-sc",
    "fonts-cjk-jp",
    "fonts-cjk-kr",
]

# Runtime-loaded color-emoji fallback. Unlike the embedded `fonts-*`
# bundles, this does *not* `include_bytes!` any font — color emoji
# fonts are typically 20-30 MB and bloat the binary. Instead, when
# enabled, `TypesetterBridge::new_with_default_font()` reads the
# platform's installed color-emoji font (Noto Color Emoji on Linux,
# Apple Color Emoji on macOS, Segoe UI Emoji on Windows) from a
# hard-coded list of well-known paths at startup. No-op on misses;
# no warning. Apps that need a specific or bundled emoji font still
# use `register_font(bytes)` directly.
system-emoji = ["dep:memmap2"]

# Enables `RichTextEngine` and the `FontRegistrar` trait. Pulls in
# `text-document` directly so the engine can consume `FlowSnapshot`,
# `TextCursor`, and `DocumentFragment`. Required by fern-widgets's
# `rich-text` feature.
rich-text = ["dep:text-document"]

[dependencies]
fern-canvas = { workspace = true }
fern-tokens = { workspace = true }
text-typeset = { workspace = true }
text-document = { workspace = true, optional = true }
# Activated by the `system-emoji` feature. The bundled color-emoji
# fonts can be ~180 MB on macOS — mmap lets the kernel page glyphs in
# on demand instead of `fs::read`-ing the whole file into a heap Vec.
memmap2 = { version = "0.9", optional = true }
