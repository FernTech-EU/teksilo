[package]
name = "teksilo-theme-material3"
edition = "2024"
version.workspace = true
license.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "Material 3 theme preset for Teksilo — tokens plus widget chrome."

[features]
# Off by default. When enabled, embeds the Roboto Flex font (Apache-2.0,
# ~1.7 MB) and switches the M3 typography family to "Roboto"; exposes
# `material3::font_registrar()`. Default builds keep the metric-compatible
# bundled Inter and pay none of the binary size.
bundled-fonts = ["dep:teksilo-text"]

[dependencies]
teksilo-core = { workspace = true }
teksilo-tokens = { workspace = true }
# Needed for the Tier-3 widget styles installed in `style_slots` (the
# `Recipe*Style` defaults + layout primitives live in teksilo-widgets).
# teksilo-widgets does NOT depend on the theme crates, so this is acyclic.
teksilo-canvas = { workspace = true }
teksilo-widgets = { workspace = true }
# Only pulled in under `bundled-fonts` (for the FontRegistrar types).
teksilo-text = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
