# This crate is listed in the root manifest's `[workspace] exclude`, so it
# is NOT a workspace member and cannot inherit anything with
# `<field>.workspace = true` — cargo rejects inheritance for an excluded
# package. Every value below is therefore spelled out, and the empty
# `[workspace]` table makes this directory its own workspace root (it
# would otherwise be pulled back toward the parent manifest).
#
# It carries its own version stream, decoupled from the framework's, for
# the same reason `teksilo-collector-proto` does: its release cadence
# follows the collector wire format, not the GUI toolkit.
[workspace]

[package]
name = "teksilo-analytics-native"
edition = "2024"
version = "0.7.0"
license = "MPL-2.0"
publish = true
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
repository = "https://github.com/FernTech-EU/teksilo.git"
homepage = "https://teksilo.rs"
description = "Teksilo analytics adapter for the home-grown gRPC `teksilo-collector` backend. Sub-phase A: localhost ingest, no auth, no TLS."
documentation = "https://docs.rs/teksilo-analytics-native"
keywords = ["grpc", "analytics", "telemetry", "collector", "teksilo"]
categories = ["network-programming"]

[dependencies]
teksilo-core = { path = "../teksilo-core", version = "0.6.2" }
teksilo-telemetry = { path = "../teksilo-telemetry", version = "0.6.2" }
teksilo-collector-proto = { path = "../../../teksilo-collector-proto", version = "0.1.0" }

# gRPC + tokio — kept local to this crate. No other teksilo crate
# uses them, so promoting them to workspace deps would leak the
# transport choice to everyone.
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport", "tls"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
teksilo-settings = { path = "../teksilo-settings", version = "0.6.2" }
