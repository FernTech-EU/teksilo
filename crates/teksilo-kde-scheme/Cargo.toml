[package]
name = "teksilo-kde-scheme"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "KDE Plasma colour schemes, configuration cascade and desktop settings for Teksilo, with no I/O."
documentation = "https://docs.rs/teksilo-kde-scheme"
keywords = ["kde", "plasma", "breeze", "color-scheme", "kconfig"]
categories = ["gui", "config", "parser-implementations"]
# The stock Breeze `.colors` files are LGPL-2.0-or-later test fixtures,
# vendored verbatim so the tests can compare against them. They are not part
# of the published crate, and neither is `tests/breeze_files.rs`, the one
# test target that reads them: left in, it would not compile from the
# package and `cargo test` there would fail. The same holds for the tests
# that read the golden vectors under `tools/kde_golden` and the clean-room
# vocabulary scan, which reads the repository's source tree.
exclude = [
    "tests/fixtures/**",
    "tests/breeze_files.rs",
    "tests/golden_math.rs",
    "tests/golden_resolve.rs",
    "tests/golden_accent.rs",
    "tests/clean_room_vocabulary.rs",
]

[dependencies]
teksilo-tokens = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Property-based testing: `tests/prop_config.rs` checks that the parser never
# panics on arbitrary bytes. `cargo-fuzz` needs a nightly toolchain, which is
# not a guaranteed CI dependency; proptest gives the same coverage plus
# shrinking on stable (see the workspace `Cargo.toml`).
proptest = { workspace = true }
# Reads the golden vectors in `tools/kde_golden/vectors`.
serde_json = { workspace = true }
