[package]
name = "cargo-teksilo-telemetry-lint"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Schema-drift linter for teksilo-telemetry event manifests"
documentation = "https://docs.rs/cargo-teksilo-telemetry-lint"
keywords = ["linter", "telemetry", "cargo-subcommand", "cli", "schema"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[[bin]]
name = "cargo-teksilo-telemetry-lint"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_yaml = "0.9"
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
