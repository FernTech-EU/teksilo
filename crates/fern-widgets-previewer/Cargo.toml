[package]
name = "fern-widgets-previewer"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

# fern-widgets-previewer is the FernUI-side previewer binary. It links
# fern-widgets with the `preview` feature so all `WidgetCatalog` impls
# under `#[cfg(feature = "preview")]` are visible to the inventory at
# link time, and fern-preview-ui as the GUI library. Each downstream
# application (Skribisto, …) builds its own analogous thin binary
# with its own widget set.
[dependencies]
fern-widgets = { workspace = true, features = ["preview", "rich-text"] }
fern-preview-ui = { workspace = true }
fern-preview = { workspace = true }

[dev-dependencies]
# Tests exercise a few signal-chain corner cases directly,
# build a `WidgetTree` to lay out every catalog variant, and
# need basic geometry / theme types for that.
fern-core = { workspace = true }
fern-canvas = { workspace = true }
fern-tokens = { workspace = true }
