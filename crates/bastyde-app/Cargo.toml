[package]
name = "bastyde-app"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["text"]
text = ["dep:bastyde-text"]
# Enables system clipboard access by forwarding to bastyde-platform and
# auto-installing a `ClipboardHandle` into the app_state registry
# during `BastydeAppBuilder::run`. Widgets pick it up via
# `EventContext::app_state::<ClipboardHandle>()`.
clipboard = ["bastyde-platform/clipboard"]
# Activates the FileDialog trait surface. Apps that ship a custom or
# mock backend enable this. The window-close hook in `WindowManager`
# uses it to purge pending callbacks owned by the closing window.
file-dialog = ["bastyde-platform/file-dialog"]
# Adds the `rfd`-backed implementation plus
# `BastydeAppBuilder::install_file_dialog` which auto-registers an
# `RfdAsyncBackend`. Implies `file-dialog`.
rfd-backend = ["file-dialog", "bastyde-platform/rfd-backend"]
# Telemetry support. Gates the `.telemetry(bundle)` builder method,
# the `install_telemetry` wiring, and the `dep:bastyde-telemetry`
# dependency. Also forwards to `bastyde-widgets/telemetry` so the
# `PrivacySettings` widget surface light up together. Off by default
# — apps that don't ship analytics pay nothing.
telemetry = ["dep:bastyde-telemetry", "dep:uuid", "bastyde-widgets/telemetry"]
# WebView routing. Lets the app event loop downcast a `WebViewEventPayload`
# in the `AppEvent::External` arm and route it to the originating window's
# `WebViewRegistry::deliver`, and purge per-window registrations on close.
# Pulls in `bastyde-webview` for the payload + registry types. Off by
# default; the umbrella `bastyde/web-view` feature turns it on.
web-view = ["dep:bastyde-webview"]
# Debug-only in-process automation bridge. Lets `bastyde-automation-mcp
# --connect <sock>` drive a *live* running app over a Unix-domain socket.
# The active machinery (socket / token / bridge thread) is additionally gated
# on `debug_assertions`, so a release build with this feature on never opens a
# socket and `install_automation_bridge_in_debug()` is a no-op. NOTE: the
# guarantee is *behavioral* — the `bastyde-automation` toolkit (executor +
# serde_json) is still linked, dead-code-eliminated only under fat LTO (the
# `release` default); a non-LTO profile such as `profiling` retains those
# symbols even though no bridge runs. Pulls in the GUI-free toolkit plus the
# wire-encoding deps.
automation = [
    "dep:bastyde-automation",
    "dep:base64",
    "dep:png",
    "dep:serde_json",
    "dep:uuid",
]

[dependencies]
bastyde-core = { workspace = true }
bastyde-canvas = { workspace = true }
bastyde-tokens = { workspace = true }
bastyde-i18n = { workspace = true }
bastyde-render = { workspace = true }
# `native-menu` is always on: `install_native_menu()` and the native-menu
# payload router reference `bastyde_platform::native_menu` directly. The objc2
# backing is macOS-target-only, so non-macOS builds pay nothing.
bastyde-platform = { workspace = true, features = ["native-menu"] }
# bastyde-widgets is needed for the tooltip registry type surface
# (`BastydeAppBuilder::register_tooltips` takes `Vec<TooltipContent>`).
# Registration wiring only — no widget constructors used here.
bastyde-widgets = { workspace = true }
bastyde-settings = { workspace = true }
bastyde-webview = { workspace = true, optional = true }
bastyde-telemetry = { workspace = true, optional = true }
bastyde-text = { workspace = true, optional = true }
# GUI-free automation toolkit + wire-encoding deps for the debug-only
# `automation` bridge. All optional, off by default.
bastyde-automation = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
png = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
winit = { workspace = true }
pollster = { workspace = true }
# Used by the telemetry session-id generator AND the automation bridge's
# per-process token; pulled in with the `telemetry` or `automation` feature.
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
