[package]
name = "bastyde-app"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["text"]
text = ["dep:bastyde-text"]
# Enables system clipboard access by forwarding to bastyde-platform and
# auto-installing a `ClipboardHandle` into the app_state registry
# during `BastydeAppBuilder::run`. Widgets pick it up via
# `EventContext::app_state::<ClipboardHandle>()`.
clipboard = ["bastyde-platform/clipboard"]
# Activates the FileDialog trait surface. Apps that ship a custom or
# mock backend enable this. The window-close hook in `WindowManager`
# uses it to purge pending callbacks owned by the closing window.
file-dialog = ["bastyde-platform/file-dialog"]
# Adds the `rfd`-backed implementation plus
# `BastydeAppBuilder::install_file_dialog` which auto-registers an
# `RfdAsyncBackend`. Implies `file-dialog`.
rfd-backend = ["file-dialog", "bastyde-platform/rfd-backend"]
# Telemetry support. Gates the `.telemetry(bundle)` builder method,
# the `install_telemetry` wiring, and the `dep:bastyde-telemetry`
# dependency. Also forwards to `bastyde-widgets/telemetry` so the
# `PrivacySettings` widget surface light up together. Off by default
# — apps that don't ship analytics pay nothing.
telemetry = ["dep:bastyde-telemetry", "dep:uuid", "bastyde-widgets/telemetry"]

[dependencies]
bastyde-core = { workspace = true }
bastyde-canvas = { workspace = true }
bastyde-tokens = { workspace = true }
bastyde-i18n = { workspace = true }
bastyde-render = { workspace = true }
# `native-menu` is always on: `install_native_menu()` and the native-menu
# payload router reference `bastyde_platform::native_menu` directly. The objc2
# backing is macOS-target-only, so non-macOS builds pay nothing.
bastyde-platform = { workspace = true, features = ["native-menu"] }
# bastyde-widgets is needed for the tooltip registry type surface
# (`BastydeAppBuilder::register_tooltips` takes `Vec<TooltipContent>`).
# Registration wiring only — no widget constructors used here.
bastyde-widgets = { workspace = true }
bastyde-settings = { workspace = true }
bastyde-telemetry = { workspace = true, optional = true }
bastyde-text = { workspace = true, optional = true }
winit = { workspace = true }
pollster = "0.4"
# Only used by the telemetry session-id generator; pulled in with the
# `telemetry` feature.
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
