[package]
name = "bastyde-automation-mcp"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "Model Context Protocol server exposing a Bastyde app's semantic tree + AT-action driving + screenshots (headless or live)."

[features]
# Pixel-level golden screenshot tests. Off by default (need a real GPU):
# `cargo test -p bastyde-automation-mcp --features golden-tests`, refresh with
# `UPDATE_GOLDENS=1`.
golden-tests = []

[dependencies]
# The GUI-free toolkit (DTOs + `execute`) and the framework pieces the
# headless server needs to host a real widget tree and render it.
bastyde-automation = { workspace = true }
bastyde = { workspace = true }
bastyde-core = { workspace = true }
bastyde-canvas = { workspace = true }
bastyde-render = { workspace = true }

# Crate-local async stack — kept OUT of `[workspace.dependencies]` (the
# `bastyde-tokio` precedent: runtimes stay confined to the crates that need
# them). `rmcp` is the official Rust MCP SDK.
rmcp = { version = "1.8", features = ["server", "macros", "transport-io", "base64"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
base64 = "0.22"
anyhow = "1"

# Workspace deps for the offscreen screenshot path.
pollster = "0.4"
wgpu = { workspace = true }
png = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
