[package]
name = "cargo-teksilo"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent tooling for apps built on the teksilo GUI framework: symbol lookup, doc search, and the automation probe harness"
documentation = "https://docs.rs/cargo-teksilo"
keywords = ["teksilo", "cargo-subcommand", "gui", "automation", "search"]
categories = ["development-tools::cargo-plugins", "development-tools"]

[[bin]]
name = "cargo-teksilo"
path = "src/main.rs"

[features]
default = ["semantic"]
semantic = ["dep:fastembed"]

[dependencies]
clap = { workspace = true }
teksilo-corpus = { workspace = true }
include_dir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
fastembed = { workspace = true, optional = true }
