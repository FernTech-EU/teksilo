[package]
name = "bastyde-charts"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
preview = ["dep:bastyde-preview"]

[dependencies]
bastyde-core = { workspace = true }
bastyde-data = { workspace = true }
bastyde-tokens = { workspace = true }
bastyde-canvas = { workspace = true }
bastyde-i18n = { workspace = true }
bastyde-preview = { workspace = true, optional = true }

[dev-dependencies]
# Used only by tests for the donut center-slot integration (TextWidget
# placement). Not part of the runtime dep graph — keeps the public
# layering (charts at the same tier as widgets).
bastyde-widgets = { workspace = true }
