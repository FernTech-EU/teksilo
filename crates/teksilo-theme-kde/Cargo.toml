[package]
name = "teksilo-theme-kde"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "KDE Plasma theme preset for Teksilo: the Breeze design language and its colour schemes and accents, as tokens. Not affiliated with or endorsed by KDE e.V."
documentation = "https://docs.rs/teksilo-theme-kde"
keywords = ["kde", "plasma", "breeze", "theme", "gui"]
categories = ["gui"]
# `tests/contrast.rs`, `tests/mount.rs` and `tests/preset_metrics.rs` read
# the golden vectors under `tools/kde_golden` (the Oxygen schemes, Plasma's
# painted pixels and its control sizes), and `tests/density_gaps.rs` reads
# `engineering/docs/density-projection-gaps.md`; left in, they would not
# compile from the package and `cargo test` there would fail.
exclude = [
    "tests/contrast.rs",
    "tests/density_gaps.rs",
    "tests/mount.rs",
    "tests/preset_metrics.rs",
]

[features]
# Both off by default. Plasma's faces are Noto Sans (text) and Hack
# (monospace); without either feature the typography keeps Teksilo's bundled
# Inter and JetBrains Mono, at the sizes and line boxes Noto Sans and Hack
# have at Plasma's default fonts.
#
# `bundled-fonts` embeds Noto Sans v2.015 (variable, upright and italic,
# OFL-1.1) and Hack v3.003 (regular, bold and their italics, MIT plus the
# Bitstream Vera licence), about 5.6 MB in all, switches the families to
# "Noto Sans" and "Hack", and exposes `font_registrar()`.
bundled-fonts = ["dep:teksilo-text"]
# `system-fonts` switches the families to "Noto Sans" and "Hack" without
# embedding them, for a desktop that has them installed, as every Plasma
# desktop does; the text engine finds them among the installed fonts, and
# falls back to the bundled default on a machine without them.
system-fonts = []

[dependencies]
teksilo-core = { workspace = true }
teksilo-tokens = { workspace = true }
# The Tier-3 widget styles this preset installs in `style_slots` are built
# from the `Recipe*Style` defaults and layout primitives of teksilo-widgets,
# drawing through teksilo-canvas. teksilo-widgets does not depend on the
# theme crates, so this is acyclic.
teksilo-canvas = { workspace = true }
teksilo-widgets = { workspace = true }
# The KDE colour-scheme model: the stock Breeze schemes, the resolved
# palette, Plasma's accent application and the colour arithmetic.
teksilo-kde-scheme = { workspace = true }
thiserror = { workspace = true }
# Only pulled in under `bundled-fonts`, for the `FontRegistrar` types.
# Declared directly, with `default-features = false`, so it does not turn on
# teksilo-text's Noto fallback fonts: which of those ship is the app's call.
teksilo-text = { path = "../teksilo-text", version = "0.19.0", optional = true, default-features = false }

[dev-dependencies]
# Property-based testing: `tests/contrast.rs` checks every declared text and
# backdrop pair over random coherent schemes. `cargo-fuzz` needs a nightly
# toolchain, which is not a guaranteed CI dependency; proptest gives the same
# coverage plus shrinking on stable (see the workspace `Cargo.toml`).
proptest = { workspace = true }
# `tests/fonts.rs` checks every file under `fonts/` against the sha256
# recorded for its upstream release.
sha2 = { workspace = true }
# Reads the golden vectors in `tools/kde_golden/vectors`.
serde_json = { workspace = true }
# `tests/mount.rs` and `tests/preset_metrics.rs` build real widget trees;
# `lit!` supplies the untranslated labels those constructors take.
teksilo-i18n = { workspace = true }
# The models behind the tables and tab bars those tests mount.
teksilo-data = { workspace = true }
# `tests/preset_metrics.rs` reuses the conformance harness's
# `in_tappable_row`, the row geometry that denies the miss-only slop pass,
# rather than a copy that could drift from the gate's. Path-only (no
# version): the crate is `publish = false`, and cargo strips versionless
# path dev-dependencies at publish time.
teksilo-target-conformance = { path = "../teksilo-target-conformance" }
# `tests/native.rs` hands `native_theme` to the app's native-theme seam,
# `resolve_native_theme`, with the desktop report the platform builds.
# Neither crate depends on this one, so this is acyclic.
teksilo-app = { workspace = true }
teksilo-platform = { workspace = true }

[package.metadata.docs.rs]
all-features = true
