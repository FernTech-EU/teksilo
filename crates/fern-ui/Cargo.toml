[package]
name = "fern-ui"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Default set: widgets, text backend, i18n runtime, plus Arabic and
# Hebrew fallback fonts so the internationalization demo and common
# RTL cases work out of the box. Applications that want a Latin-only
# minimal build can disable fonts via `default-features = false` and
# re-add only the features they need (e.g. `features = ["widgets",
# "text", "i18n"]` for text support without the Noto bundles).
default = [
    "widgets",
    "text",
    "i18n",
    "inspector",
    "fonts-arabic",
    "fonts-hebrew",
]

widgets = ["dep:fern-widgets"]
text = ["dep:fern-text", "fern-app/text"]
i18n = ["dep:fern-i18n"]
rich-text = ["widgets", "fern-widgets/rich-text"]
# Debug-only in-app inspector (`F12`, picker, AllBounds overlay,
# theme/locale switchers, models tab, …). Pulls in `rich-text`
# transitively because the Tree tab's filter input requires it. The
# crate itself is `cfg(debug_assertions)` — release builds compile to
# a no-op — but the Cargo dep is unconditional; turn this feature off
# if you want to drop the transitive `rich-text` cost too.
inspector = ["dep:fern-inspector", "rich-text"]
# Forwards clipboard support through fern-app so `RichTextEditor::editor`
# can copy/cut/paste via the system clipboard. Without this feature the
# editor silently no-ops clipboard commands (they are filtered at the
# command level; `arboard` is not pulled into the build).
clipboard = ["fern-app/clipboard"]

# Font bundle features — forwarded to `fern-text`'s own feature set
# via the `fern-text?/...` optional-dep syntax. The `?` means the
# forwarding only activates when `fern-text` itself is in the build
# (i.e., when the `text` feature is enabled); a user that only wants
# i18n-without-text will see these as silent no-ops. Applications
# enable the scripts they ship for and disable the rest.
#
# Each feature maps 1:1 to a feature of the same name on `fern-text`,
# which in turn decides whether to `include_bytes!` the corresponding
# Noto Sans variable font at compile time and register it with the
# typesetter's fallback chain.
fonts-arabic = ["fern-text?/fonts-arabic"]
fonts-hebrew = ["fern-text?/fonts-hebrew"]
fonts-thai = ["fern-text?/fonts-thai"]
fonts-devanagari = ["fern-text?/fonts-devanagari"]
fonts-cjk-sc = ["fern-text?/fonts-cjk-sc"]
fonts-cjk-jp = ["fern-text?/fonts-cjk-jp"]
fonts-cjk-kr = ["fern-text?/fonts-cjk-kr"]

# Convenience meta-features, again forwarded to `fern-text`.
fonts-all-non-cjk = ["fern-text?/fonts-all-non-cjk"]
fonts-all = ["fern-text?/fonts-all"]

# Opt-in runtime color-emoji fallback. Forwards to
# `fern-text/system-emoji`, which loads Noto Color Emoji / Apple
# Color Emoji / Segoe UI Emoji from a hard-coded list of installed
# system paths at startup. Off by default — color-emoji fonts are
# large (20-30 MB) and not always present; apps that ship cross-
# platform UI with emoji should opt in here.
system-emoji = ["fern-text?/system-emoji"]

[dependencies]
fern-tokens = { workspace = true }
fern-canvas = { workspace = true }
fern-core = { workspace = true }
fern-ui-macros = { workspace = true }
fern-data = { workspace = true }
fern-render = { workspace = true }
fern-platform = { workspace = true }
fern-app = { workspace = true }
fern-settings = { workspace = true }
fern-widgets = { workspace = true, optional = true }
# Declared directly (not via `workspace = true`) so we can set
# `default-features = false` — Cargo rejects overriding
# `default-features` on a workspace-inherited dep. fern-ui's own
# feature flags are then the authoritative control over which Noto
# Sans fonts get bundled: `default = ["fonts-arabic", "fonts-hebrew"]`
# restores the out-of-the-box behavior, and downstream apps that use
# `default-features = false` on fern-ui get a clean slate with no
# Noto fonts bundled.
fern-text = { path = "../fern-text", version = "0.1.0", optional = true, default-features = false }
fern-i18n = { workspace = true, optional = true }
fern-inspector = { workspace = true, optional = true }
fern-resources = { workspace = true }

[dev-dependencies]
trybuild = "1"
