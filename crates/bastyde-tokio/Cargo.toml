[package]
name = "bastyde-tokio"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tokio reactor integration for Bastyde's main-thread async executor (bastyde-async)."

[dependencies]
bastyde-core = { workspace = true }
bastyde-app = { workspace = true }
bastyde-async = { workspace = true }
# Kept local — the runtime choice must not leak to other bastyde crates
# (same policy as tokio in bastyde-analytics-bastyde). `enable_all` needs the
# time + net drivers so apps can `.await` timers and sockets (reqwest, …).
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }
