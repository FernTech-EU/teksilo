[package]
name = "bastyde-platform"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bastyde-tokens = { workspace = true }
bastyde-core = { workspace = true }
bastyde-canvas = { workspace = true }
bastyde-render = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = "0.32"
arboard = { workspace = true, optional = true }
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
], optional = true }
async-std = { version = "1", optional = true }
thiserror = { workspace = true }

[features]
default = []
# Chains through `bastyde-app/clipboard` → `bastyde/clipboard`. Apps
# enabling this feature get `ClipboardHandle` auto-installed into
# the app-state registry during `BastydeAppBuilder::run`, reachable
# from widgets via `EventContext::app_state::<ClipboardHandle>()`.
clipboard = ["dep:arboard"]

# Defines the FileDialog trait surface (FileDialogBackend trait,
# FileDialogHandle, FileDialogRequest, FileDialogResult,
# FileDialogEventPayload, MemoryFileDialog). No external runtime
# deps beyond bastyde-core. Lets a host app ship its own backend
# without paying for rfd. Apps that want native dialogs enable
# `rfd-backend` instead, which implies this feature.
file-dialog = []

# Adds `RfdAsyncBackend` — a native-dialog adapter backed by the
# `rfd` crate plus an `async-std` worker pool to drive its futures
# off the UI thread. Implies `file-dialog`.
rfd-backend = ["file-dialog", "dep:rfd", "dep:async-std"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSAccessibility",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSGraphics",
    "NSButton",
    "NSControl",
    # External drag-and-drop destination: NSDraggingInfo / NSDraggingDestination /
    # NSDragOperation, and NSPasteboard + NSPasteboardType constants.
    "NSDragging",
    "NSPasteboard",
    # External drag-and-drop *source* (outbound, app → OS): NSDraggingSource /
    # NSDraggingItem / NSDraggingSession, the drag image (NSImage), the
    # triggering event (NSApplication::currentEvent → NSEvent).
    "NSDraggingItem",
    "NSDraggingSession",
    "NSImage",
    "NSApplication",
    "NSEvent",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSString",
    "NSURL",
    "NSDictionary",
    "NSGeometry",
    "NSEnumerator",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "UI_ViewManagement",
    # Custom title bar (M4/M5): DwmExtendFrameIntoClientArea, the
    # subclass chain (SetWindowSubclass / DefSubclassProc), per-monitor
    # DPI metrics, monitor work-area clamping for maximized windows,
    # and the POINT/RECT/HWND core types those APIs traffic in.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",                  # MARGINS
    "Win32_UI_Shell",                     # SetWindowSubclass / DefSubclassProc / RemoveWindowSubclass / DragQueryFileW / HDROP
    "Win32_UI_Input_KeyboardAndMouse",    # TrackMouseEvent / TRACKMOUSEEVENT / TME_*
    "Win32_Foundation",
    # External (OS) drag-and-drop: OLE drop target.
    "Win32_System_Ole",                   # RegisterDragDrop / RevokeDragDrop / OleInitialize / IDropTarget / ReleaseStgMedium / CF_*
    "Win32_System_Com",                   # IDataObject / FORMATETC / STGMEDIUM / TYMED / DVASPECT
    "Win32_System_Memory",                # GlobalLock / GlobalUnlock
    "Win32_System_SystemServices",        # CF_HDROP / CF_UNICODETEXT clipboard format constants
    "Win32_System_DataExchange",          # RegisterClipboardFormatW (CFSTR_INETURL)
] }

# External (OS) drag-and-drop on Linux: a `wl_data_device` listener bound to
# winit's Wayland display via the system libwayland multi-queue model
# (`from_foreign_display`). No-op under X11 (the backend self-detects).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
libc = "0.2"
