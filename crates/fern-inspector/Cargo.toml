[package]
name = "fern-inspector"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

# In-app debug inspector for FernUI. Active only in debug builds
# (`cfg(debug_assertions)`); release builds compile to no-ops.
#
# Apps wire it in with one line:
#
# ```rust
# use fern_inspector::FernAppBuilderInspectorExt;
# FernAppBuilder::new()
#     .install_inspector_in_debug()   // no-op in release
#     .initial_window(...)
#     .run();
# ```
#
# Toggle at runtime with F12, at launch with `--fern-inspector` or
# `FERN_INSPECTOR=1`.

[dependencies]
fern-canvas = { workspace = true }
fern-core = { workspace = true }
fern-app = { workspace = true }
fern-data = { workspace = true }
fern-i18n = { workspace = true }
fern-platform = { workspace = true }
fern-settings = { workspace = true }
fern-tokens = { workspace = true }
# `rich-text` is needed for the Tree tab's filter `TextInput`. It pulls
# in `fern-text` (text-typeset) which is the only realistic way to get
# a polished editable input. Inspector is debug-only so the cost is
# acceptable; release builds compile out everything in this crate.
fern-widgets = { workspace = true, features = ["rich-text"] }
serde_json = { workspace = true }

[dev-dependencies]
