[package]
name = "fern-widgets"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Rich-text widgets. fern-platform is now an unconditional dep of
# the crate (used by the privacy widget for the file-dialog API),
# so the `dep:fern-platform` gate it previously carried is dropped.
rich-text = ["dep:fern-text"]
# Preview catalog impls — opt-in `WidgetCatalog` implementations
# alongside each widget, registered with the `inventory` crate so the
# `fern-preview-ui` previewer GUI discovers them at link time. Off by
# default — pulls in no runtime cost and adds no symbols when not
# enabled. Standard production builds and headless tests ignore it.
preview = ["dep:fern-preview"]

[dependencies]
fern-core = { workspace = true }
fern-data = { workspace = true }
fern-tokens = { workspace = true }
fern-canvas = { workspace = true }
fern-i18n = { workspace = true }
# `PrivacySettings` widget binds to `OpenedTelemetry` and `ConsentStore`.
# Pulling fern-telemetry in unconditionally is fine — when an app doesn't
# install a `TelemetryBundle`, the widget shows a "telemetry not configured"
# placeholder and produces no events.
fern-telemetry = { workspace = true }
# JSON rendering for the privacy widget's "Get my data" viewer.
serde_json = { workspace = true }
# `PrivacySettings` widget reaches native file dialogs through
# `fern_platform::file_dialog::EventContextFileDialogExt`. The
# `file-dialog` feature on fern-platform brings in just the trait
# surface — no rfd, no async-std. The real `RfdAsyncBackend` is opt-in
# via `fern-app/rfd-backend` (chained from `fern-ui/file-dialog`).
fern-platform = { workspace = true, features = ["file-dialog"] }
fern-preview = { workspace = true, optional = true }
# `open` powers rich-tooltip links that point at real URLs
# (http, https, mailto, file paths, …). Small, pure-Rust, no deps
# on GUI toolkits — just spawns the OS default handler.
open = { workspace = true }
# Date/time backing for Calendar / DateEdit / TimeEdit / DateTimeEdit. The
# four widgets re-export the relevant types through `common::datetime` so
# the rest of the codebase never names `jiff` directly.
jiff = { workspace = true }
# text-typeset + text-document come through fern-text's re-exports
# (`fern_text::text_document`, `fern_text::RichTextEngine`, …) under
# its own `rich-text` feature. Widgets never name either crate
# directly, keeping fern-widgets's dependency surface minimal.
fern-text = { workspace = true, optional = true, features = ["rich-text"] }

[dev-dependencies]
accesskit_consumer = "0.35.0"
