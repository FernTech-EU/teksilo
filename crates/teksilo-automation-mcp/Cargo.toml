[package]
name = "teksilo-automation-mcp"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
description = "Model Context Protocol server exposing a Teksilo app's semantic tree + AT-action driving + screenshots (headless or live)."

[features]
# Pixel-level golden screenshot tests. Off by default (need a real GPU):
# `cargo test -p teksilo-automation-mcp --features golden-tests`, refresh with
# `UPDATE_GOLDENS=1`.
golden-tests = []

[dependencies]
# The GUI-free toolkit (DTOs + `execute`) and the framework pieces the
# headless server needs to host a real widget tree and render it.
teksilo-automation = { workspace = true }
teksilo = { workspace = true }
teksilo-core = { workspace = true }
teksilo-canvas = { workspace = true }
teksilo-render = { workspace = true }

# Crate-local async stack — kept OUT of `[workspace.dependencies]` (the
# `teksilo-tokio` precedent: runtimes stay confined to the crates that need
# them). `rmcp` is the official Rust MCP SDK.
rmcp = { version = "2.2", features = ["server", "macros", "transport-io", "base64"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
base64 = "0.22"
anyhow = "1"

# Workspace deps for the offscreen screenshot path.
pollster = { workspace = true }
wgpu = { workspace = true }
png = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
