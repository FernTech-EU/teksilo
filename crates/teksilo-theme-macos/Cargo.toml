[package]
name = "teksilo-theme-macos"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "macOS Aqua and Dark Aqua theme preset for Teksilo — tokens plus widget chrome."
documentation = "https://docs.rs/teksilo-theme-macos"
keywords = ["macos", "aqua", "theme", "gui", "design-system"]
categories = ["gui", "os::macos-apis"]

[features]
# Off by default. Switches the theme's typography families to the macOS
# system stack — "SF Pro Text" for UI text and "SF Mono" for monospace —
# instead of the metric-neutral bundled Inter / JetBrains Mono.
#
# Like Fluent's `system-fonts`, and unlike Material 3's `bundled-fonts`,
# there is no font to embed: San Francisco is licensed for use *on* Apple
# platforms only and cannot be redistributed inside a cross-platform
# binary, so the only honest option is to *name* the faces and let the text
# engine resolve them from the installed system fonts. On a machine without
# them the engine falls back to the bundled default, so enabling the feature
# is never fatal — it simply does nothing off macOS.
system-fonts = []

[dependencies]
teksilo-core = { workspace = true }
teksilo-tokens = { workspace = true }
# Needed for the Tier-3 widget styles installed in `style_slots` (the
# `Recipe*Style` defaults + layout primitives live in teksilo-widgets).
# teksilo-widgets does NOT depend on the theme crates, so this is acyclic.
teksilo-canvas = { workspace = true }
teksilo-widgets = { workspace = true }

[dev-dependencies]
# `tests/mount.rs` builds a real `WidgetTree` per widget; `lit!` supplies
# the untranslated labels those constructors take.
teksilo-i18n = { workspace = true }
# `tests/preset_metrics.rs` reuses the conformance harness's `in_tappable_row`
# — the row geometry that denies the miss-only slop pass — instead of keeping
# a copy that could drift from the gate's. Path-only (no version): the crate
# is `publish = false`, and cargo strips versionless path dev-dependencies at
# publish time, so this never reaches a published manifest.
teksilo-target-conformance = { path = "../teksilo-target-conformance" }
# `tests/preset_metrics.rs` mounts the data views this preset restyles, and
# those take a `ListModel` rather than a plain slice.
teksilo-data = { workspace = true }

[package.metadata.docs.rs]
all-features = true
