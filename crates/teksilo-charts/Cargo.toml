[package]
name = "teksilo-charts"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bar, line and pie charts for Teksilo, driven by a reactive chart model."
documentation = "https://docs.rs/teksilo-charts"
keywords = ["charts", "visualization", "graphs", "plotting", "gui"]
categories = ["visualization", "gui"]

[features]
preview = ["dep:teksilo-preview"]

[dependencies]
teksilo-core = { workspace = true }
teksilo-data = { workspace = true }
teksilo-tokens = { workspace = true }
teksilo-canvas = { workspace = true }
teksilo-i18n = { workspace = true }
teksilo-preview = { workspace = true, optional = true }

[dev-dependencies]
# Used only by tests for the donut center-slot integration (TextWidget
# placement). Not part of the runtime dep graph — keeps the public
# layering (charts at the same tier as widgets).
teksilo-widgets = { workspace = true }

[package.metadata.docs.rs]
all-features = true
