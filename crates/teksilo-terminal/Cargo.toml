[package]
name = "teksilo-terminal"
description = "Embeddable, fully-accessible terminal-emulator (Console) widget for Teksilo — the VT view; PTY + parsing delegated to portable-pty + alacritty_terminal behind a swappable engine trait."
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
teksilo-core = { workspace = true }
teksilo-tokens = { workspace = true }
teksilo-canvas = { workspace = true }
# For the `ClipboardHandle` type (copy/paste). Retrieved from app-state at
# runtime; the widget names the type but doesn't construct a backend.
teksilo-platform = { workspace = true }
# For the `Role::Terminal` / `Live` / `Action` a11y constants.
accesskit = { workspace = true }

# --- Terminal engine backend (opt-in) ---
# Kept OFF by default so a plain workspace `cargo build` / `cargo test` stays
# light and green without pulling a PTY layer or a VT parser. The umbrella
# `teksilo` crate's `terminal` feature turns the default `alacritty` backend on.
#
# `portable-pty` = WezTerm's cross-platform pseudo-terminal (ConPTY on Windows,
# openpty/forkpty on Unix). `alacritty_terminal` = Alacritty's standalone VT
# parser + grid + scrollback model. We reuse alacritty's `Term` + `vte` parser
# for the emulation and portable-pty for the PTY — the widget owns only the
# *view* (render, input encoding, accessibility). Both permissive-licensed.
portable-pty = { workspace = true, optional = true }
alacritty_terminal = { workspace = true, optional = true }

# For a hard `SIGKILL` on Unix under `TerminalClosePolicy::KillOnDrop` —
# portable-pty's own kill sends only `SIGHUP`. Used by the alacritty-gated
# `pty` module; `libc` is a ubiquitous leaf crate already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Production engine backend: portable-pty (PTY) + alacritty_terminal (VT model).
alacritty = ["dep:portable-pty", "dep:alacritty_terminal"]

[dev-dependencies]
# The headless tests exercise the engine-agnostic view (input encoder, cell
# hit-test, a11y tree) against the `MemoryEngine` test backend, plus the
# `alacritty` backend end-to-end where a real shell is available.
teksilo-core = { workspace = true }
