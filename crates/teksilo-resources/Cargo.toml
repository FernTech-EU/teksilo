[package]
name = "teksilo-resources"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Resource handling and embedding for Teksilo applications."
documentation = "https://docs.rs/teksilo-resources"
keywords = ["resources", "embedding", "assets", "desktop", "gui"]
categories = ["gui"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
# The SVG validator parses candidate files with the *same* parser that renders
# them (see `validate_svg`), so `res!` accepts exactly what `SvgIcon` can draw —
# no second, looser notion of "valid SVG" to drift out of step. Safe as a
# proc-macro dependency: teksilo-canvas is renderer-agnostic (no GPU, no wgpu)
# and does not depend on this crate, so there is no cycle.
teksilo-canvas = { workspace = true }

[package.metadata.docs.rs]
all-features = true
