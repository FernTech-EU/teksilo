[package]
name = "teksilo-parse"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Parser and IR for Teksilo's teksu! widget-tree DSL, shared by the proc macro and the formatter."
documentation = "https://docs.rs/teksilo-parse"
keywords = ["parser", "dsl", "ast", "ir", "teksu"]
categories = ["parser-implementations", "development-tools"]

[dependencies]
proc-macro2 = "1"
syn = { version = "3", features = ["full", "extra-traits"] }

[package.metadata.docs.rs]
all-features = true
