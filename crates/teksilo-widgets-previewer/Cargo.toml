[package]
name = "teksilo-widgets-previewer"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Storybook-style previewer for the stock Teksilo widget catalog."
documentation = "https://docs.rs/teksilo-widgets-previewer"
keywords = ["storybook", "previewer", "widgets", "catalog", "gui"]
categories = ["gui", "development-tools"]

# teksilo-widgets-previewer is the Teksilo-side previewer binary. It links
# teksilo-widgets with the `preview` feature so all `WidgetCatalog` impls
# under `#[cfg(feature = "preview")]` are visible to the inventory at
# link time, and teksilo-preview-ui as the GUI library. Each downstream
# application (Skribisto, …) builds its own analogous thin binary
# with its own widget set.
[dependencies]
teksilo-widgets = { workspace = true, features = ["preview"] }
teksilo-preview-ui = { workspace = true }
teksilo-preview = { workspace = true }

[dev-dependencies]
# Tests exercise a few signal-chain corner cases directly,
# build a `WidgetTree` to lay out every catalog variant, and
# need basic geometry / theme types for that.
teksilo-core = { workspace = true }
teksilo-canvas = { workspace = true }
teksilo-tokens = { workspace = true }

[package.metadata.docs.rs]
all-features = true
