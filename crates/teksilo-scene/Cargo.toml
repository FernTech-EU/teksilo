[package]
name = "teksilo-scene"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pannable, zoomable scene viewport for Teksilo — full widgets and lightweight items under one view transform."
documentation = "https://docs.rs/teksilo-scene"
keywords = ["scene-graph", "gui", "pan-zoom", "canvas", "graphics"]
categories = ["gui", "graphics"]

[dependencies]
teksilo-tokens = { workspace = true }
teksilo-canvas = { workspace = true }
teksilo-core = { workspace = true }
teksilo-data = { workspace = true }
teksilo-i18n = { workspace = true }
# Runtime dep: the scene reuses the widget catalog both as heavyweight
# item content and to render lightweight-item tooltips (TooltipWidget).
# teksilo-widgets does not depend on teksilo-scene, so this is acyclic.
teksilo-widgets = { workspace = true }
accesskit = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test-only: property-based testing (see the `proptest` entry in the
# workspace manifest for why proptest rather than cargo-fuzz).
proptest = { workspace = true }
# Test-only: every platform adapter answers its text API through this
# consumer, so it — not what the scene believes it emitted — is what
# decides whether a text item can be reviewed by character and word.
accesskit_consumer = { workspace = true }
# Test-only: the caret-follow tests embed a real `RichTextEditor`, whose
# document type lives here. Nothing in the crate proper needs it.
teksilo-text = { workspace = true }

[package.metadata.docs.rs]
all-features = true
