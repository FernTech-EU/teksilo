[package]
name = "teksilo-corpus"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Version-matched Teksilo documentation corpus and retrieval index"
documentation = "https://docs.rs/teksilo-corpus"
keywords = ["teksilo", "documentation", "corpus", "search", "gui"]
categories = ["development-tools", "gui"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Keep the committed corpus in step with the version being released.
#
# `build_corpus.py` writes the workspace version into `index.json`, so a bump
# alone makes the committed corpus stale and the next CI run red — before any
# doc has changed. These two lines are the `--check` gates from the pre-commit
# set, each with its repair as the fallback: regenerate when the corpus drifted,
# re-encode when that dropped a chunk's vector. When nothing but the version
# moved, every chunk's text is unchanged, so the generator carries all vectors
# forward, `--check-vectors` passes, and the expensive second pass is skipped.
#
# Four things about the hook, each verified against cargo-release 1.1.2 rather
# than assumed, because all four have to hold for this to be correct:
#   1. It lives HERE, not in `release.toml`, so it runs once — for this one
#      crate — instead of once per workspace member.
#   2. Its cwd is this crate's directory, hence the `cd ../..`.
#   3. The workspace version is ALREADY bumped when it runs, so
#      `read_workspace_version` sees the new one. Were it the other way round,
#      this hook would confidently stamp the corpus with the OLD version.
#   4. Files it writes land in the release commit — cargo-release commits the
#      whole tree, not just the manifests it edited.
#
# `sh -c` means releases run from a Unix shell; that is where this workspace is
# released from. The second pass needs the `semantic` feature and its encoder
# (≈129 MB, cached per-user), and a failure aborts the release on purpose: a
# corpus shipped with missing vectors degrades `cargo teksilo search` to BM25
# silently, which is worse than a release that stops and says so.
#
# The pre-commit gates run first, and the two that FORMAT run before everything
# else — not for tidiness. The corpus ingests 978 chunks of `examples/*.rs` and
# records a `line_start`/`line_end` per chunk, so reformatting those files after
# the corpus is built leaves every example chunk pointing at the wrong lines and
# reddens `--check` on the next push. Formatters first, corpus last, and the
# read-only gates in between so the cheap ones fail fast.
#
# Two deliberate departures from the list in CLAUDE.md's "Pre-commit gates":
# `cargo doc` is capped at `-j 4` (uncapped it fans out one rustdoc per crate
# and peaks near 32 GiB), and `teksilo-fmt` runs through `cargo run -p` rather
# than the installed subcommand, so it is the version in this tree rather than
# whatever is on PATH — the same reason `build-vectors` does.
#
# The Widget Catalog is regenerated too, and its `--api-dir` build is the reason
# two `cargo doc` runs sit next to each other rather than one. The catalog's deep
# links point at docs.rs, which publishes PUBLIC items only, and `--api-dir`
# emits the deepest link it can verify against the tree it is given. Handed the
# gate's `--document-private-items` build it verifies module pages docs.rs will
# never have: that is how `docs/scene/*.md` came to ship links to
# `teksilo_scene/items/index.html`, a module that is not `pub`. So a public,
# four-crate build — the set `--catalog-all` visits, and what the docs workflow
# builds — goes first and owns `--api-dir`, then the private workspace build runs
# as the gate. `rm -rf target/doc` between them is not housekeeping: it is what
# stops a previous run's private pages from being verified against.
#
# On failure cargo-release aborts with `release of teksilo-corpus aborted by
# non-zero return of prerelease hook`, and makes no commit and no tag — but the
# version bump has already been written to every manifest by then, so the tree
# is left dirty at the new version. Fix the gate and re-run, or `git checkout
# -- .` to get back to where you started.
#
# NOT included, and each on purpose: `cargo test --workspace` (cargo-release
# already runs `cargo publish --dry-run` per crate via `verify = true`, and a
# full headless sweep here would double a release's wall time — run it before
# releasing), `mdbook build` and `extract_widget_api.py --test` (neither gates
# anything the release publishes), and the telemetry lint (it belongs to one
# example crate, which is `publish = false`).
[package.metadata.release]
pre-release-hook = [
    "sh",
    "-c",
    """cd ../.. \
&& cargo fmt --all \
&& cargo run -q -p cargo-teksilo-fmt -- teksilo-fmt \
&& typos --config _typos.toml \
&& python3 tools/check_spdx_headers.py --check \
&& cargo check --workspace \
&& cargo clippy --workspace --all-targets -- -D warnings -A deprecated \
&& rm -rf target/doc \
&& cargo doc -p teksilo-widgets -p teksilo-data -p teksilo-settings -p teksilo-scene --no-deps \
&& python3 tools/extract_widget_api.py --catalog-all --api-dir target/doc \
&& RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items -j 4 \
&& { python3 tools/build_corpus.py --check --quiet || python3 tools/build_corpus.py; } \
&& { python3 tools/build_corpus.py --check-vectors --quiet || cargo run -p cargo-teksilo --features semantic -- teksilo build-vectors; }""",
]
