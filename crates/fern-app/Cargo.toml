[package]
name = "fern-app"
edition = "2024"
version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["text"]
text = ["dep:fern-text"]
# Enables system clipboard access by forwarding to fern-platform and
# auto-installing a `ClipboardHandle` into the app_state registry
# during `FernAppBuilder::run`. Widgets pick it up via
# `EventContext::app_state::<ClipboardHandle>()`.
clipboard = ["fern-platform/clipboard"]
# Activates the FileDialog trait surface. Apps that ship a custom or
# mock backend enable this. The window-close hook in `WindowManager`
# uses it to purge pending callbacks owned by the closing window.
file-dialog = ["fern-platform/file-dialog"]
# Adds the `rfd`-backed implementation plus
# `FernAppBuilder::install_file_dialog` which auto-registers an
# `RfdAsyncBackend`. Implies `file-dialog`.
rfd-backend = ["file-dialog", "fern-platform/rfd-backend"]

[dependencies]
fern-core = { workspace = true }
fern-canvas = { workspace = true }
fern-tokens = { workspace = true }
fern-i18n = { workspace = true }
fern-render = { workspace = true }
fern-platform = { workspace = true }
# fern-widgets is needed for the tooltip registry type surface
# (`FernAppBuilder::register_tooltips` takes `Vec<TooltipContent>`).
# Registration wiring only — no widget constructors used here.
fern-widgets = { workspace = true }
fern-settings = { workspace = true }
fern-telemetry = { workspace = true }
fern-text = { workspace = true, optional = true }
winit = { workspace = true }
pollster = "0.4"
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde = { workspace = true }
