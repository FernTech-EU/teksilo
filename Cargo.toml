[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
]
# `fern-analytics-fern` builds protobuf-src from source (transitively
# via `fern-collector-proto`), which needs a system `cmake` + C++
# toolchain. It's opt-in and only consumed by the `telemetry-fern`
# example, so excluding both keeps a default `cargo build`/`cargo test`
# working without that toolchain. Build them explicitly with
# `-p fern-analytics-fern` (and
# `--manifest-path examples/telemetry_fern/Cargo.toml`) when cmake is
# available.
#
# `fern-collector-proto` itself lives in a sibling repo at
# `../fern-collector-proto` — its wire-format version stream is
# decoupled from this workspace's release version.
exclude = [
    "crates/fern-analytics-fern",
    "examples/telemetry_fern",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
publish = false
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
repository = "https://github.com/jacquetc/fern-ui"

[workspace.dependencies]
# Shared dependency versions
accesskit = "0.24.0"
tiny-skia = "0.12.0"
wgpu = "29.0.1"
winit = "0.30"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
notify = "8.2.0"
intl-memoizer = "0.5"
icu_decimal = "2"
icu_datetime = "2"
icu_calendar = "2"
icu_locale_core = "2"
fixed_decimal = { version = "0.7", features = ["ryu"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
directories = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
redb = "4"
arboard = { version = "3.4", features = ["wayland-data-control"] }
open = "5"
roxmltree = "0.20"
png = "0.17"
image-webp = "0.2"
inventory = "0.3"
bytemuck = { version = "1", features = ["derive"] }
# Date/time. Used by Calendar / DateEdit / TimeEdit / DateTimeEdit. `jiff`
# is the modern BurntSushi-authored crate with a bundled IANA tz database.
# Default features enable tzdb + tz-system so `Zoned::now()` resolves
# the user's local "today" from the OS.
jiff = "0.1"
text-document = { path = "../text-document/crates/public_api" }
text-typeset = { path = "../text-typeset" }

# Internal crates
fern-tokens = { path = "crates/fern-tokens", version = "0.2.0" }
fern-canvas = { path = "crates/fern-canvas", version = "0.2.0" }
fern-core = { path = "crates/fern-core", version = "0.2.0" }
fern-data = { path = "crates/fern-data", version = "0.2.0" }
fern-settings = { path = "crates/fern-settings", version = "0.2.0" }
fern-telemetry = { path = "crates/fern-telemetry", version = "0.2.0" }
fern-analytics-plausible = { path = "crates/fern-analytics-plausible", version = "0.2.0" }
fern-analytics-otlp = { path = "crates/fern-analytics-otlp", version = "0.2.0" }
fern-widgets = { path = "crates/fern-widgets", version = "0.2.0" }
fern-charts = { path = "crates/fern-charts", version = "0.2.0" }
fern-scene = { path = "crates/fern-scene", version = "0.2.0" }
fern-i18n = { path = "crates/fern-i18n", version = "0.2.0" }
fern-i18n-macros = { path = "crates/fern-i18n-macros", version = "0.2.0" }
cargo-fern-fmt = { path = "crates/cargo-fern-fmt", version = "0.2.0" }
fern-fmt = { path = "crates/fern-fmt", version = "0.2.0" }
fern-fmt-lsp = { path = "crates/fern-fmt-lsp", version = "0.2.0" }
fern-parse = { path = "crates/fern-parse", version = "0.2.0" }
fern-ui-macros = { path = "crates/fern-ui-macros", version = "0.2.0" }
fern-text = { path = "crates/fern-text", version = "0.2.0" }
fern-render = { path = "crates/fern-render", version = "0.2.0" }
fern-platform = { path = "crates/fern-platform", version = "0.2.0" }
fern-app = { path = "crates/fern-app", version = "0.2.0" }
fern-inspector = { path = "crates/fern-inspector", version = "0.2.0" }
fern-resources = { path = "crates/fern-resources", version = "0.2.0" }
fern-ui = { path = "crates/fern-ui", version = "0.2.0" }
fern-preview = { path = "crates/fern-preview", version = "0.2.0" }
fern-preview-ui = { path = "crates/fern-preview-ui", version = "0.2.0" }
fern-theme-material3 = { path = "crates/fern-theme-material3", version = "0.2.0" }
fern-theme-macos = { path = "crates/fern-theme-macos", version = "0.2.0" }
fern-theme-fluent = { path = "crates/fern-theme-fluent", version = "0.2.0" }

# gRPC proto crate — lives in a sibling repo at `../fern-collector-proto`
# so the wire-format spec has its own version stream (and the
# `fern-collector` server can consume it without needing the entire
# fern-ui checkout). Path-dep into the sibling for now; promote to a
# git-rev / crates.io dep once the schema stabilises. The only fern-ui
# consumer (`fern-analytics-fern`) owns its own tonic / prost / tokio
# versions since no other framework crate uses them.
fern-collector-proto = { path = "../fern-collector-proto", version = "0.1.0" }
fern-analytics-fern = { path = "crates/fern-analytics-fern", version = "0.2.0" }
fern-telemetry-codegen = { path = "crates/fern-telemetry-codegen", version = "0.2.0" }


[profile.release]
lto = "fat"
panic = "abort"
# `strip = true` (equivalent to `strip = "symbols"`) triggers a heisenbug
# under the combo `lto = "fat" + codegen-units = 1` on macOS-aarch64
# where the binary makes a 192 MB MALLOC_LARGE allocation at startup
# that is never used and only freed back to the malloc cache (visible
# as `MALLOC_LARGE (empty)` in vmmap). Measured on simple-button:
# strip = true   → 396 MB resident, 366 MB in two MALLOC_LARGE regions
# strip = "debuginfo" → 29 MB resident, 0 MALLOC_LARGE
# The bug is heisen — any debug-info change suppresses it, so the
# offending allocation site can't be symbolicated. `"debuginfo"` keeps
# the Rust function symbol table (sub-MB cost) while still removing
# DWARF, and side-steps the codegen pathology entirely.
strip = "debuginfo"
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = false
debug = true
lto = false
