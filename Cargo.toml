[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
]
# `bastyde-analytics-bastyde` builds protobuf-src from source (transitively
# via `bastyde-collector-proto`), which needs a system `cmake` + C++
# toolchain. It's opt-in and only consumed by the `telemetry-bastyde`
# example, so excluding both keeps a default `cargo build`/`cargo test`
# working without that toolchain. Build them explicitly with
# `-p bastyde-analytics-bastyde` (and
# `--manifest-path examples/telemetry_bastyde/Cargo.toml`) when cmake is
# available.
#
# `bastyde-collector-proto` itself lives in a sibling repo at
# `../bastyde-collector-proto` — its wire-format version stream is
# decoupled from this workspace's release version.
exclude = [
    "crates/bastyde-analytics-bastyde",
    "examples/telemetry_bastyde",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"
publish = false
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
repository = "https://github.com/ferntech-eu/bastyde"

[workspace.dependencies]
# Shared dependency versions
accesskit = "0.24.0"
tiny-skia = "0.12.0"
wgpu = "29.0.1"
winit = "0.30"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
notify = "8.2.0"
intl-memoizer = "0.5"
icu_decimal = "2"
icu_datetime = "2"
icu_calendar = "2"
icu_locale_core = "2"
fixed_decimal = { version = "0.7", features = ["ryu"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
directories = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
redb = "4"
arboard = { version = "3.4", features = ["wayland-data-control"] }
open = "5.3"
roxmltree = "0.21.1"
png = "0.18"
image-webp = "0.2"
inventory = "0.3"
bytemuck = { version = "1", features = ["derive"] }
# Date/time. Used by Calendar / DateEdit / TimeEdit / DateTimeEdit. `jiff`
# is the modern BurntSushi-authored crate with a bundled IANA tz database.
# Default features enable tzdb + tz-system so `Zoned::now()` resolves
# the user's local "today" from the OS.
jiff = "0.2"
text-document = { path = "../text-document/crates/public_api", version = "1.5.6" }
text-typeset = { path = "../text-typeset", version = "1.4.5" }

# Internal crates
bastyde-tokens = { path = "crates/bastyde-tokens", version = "0.5.0" }
bastyde-canvas = { path = "crates/bastyde-canvas", version = "0.5.0" }
bastyde-core = { path = "crates/bastyde-core", version = "0.5.0" }
bastyde-data = { path = "crates/bastyde-data", version = "0.5.0" }
bastyde-settings = { path = "crates/bastyde-settings", version = "0.5.0" }
bastyde-telemetry = { path = "crates/bastyde-telemetry", version = "0.5.0" }
bastyde-analytics-plausible = { path = "crates/bastyde-analytics-plausible", version = "0.5.0" }
bastyde-analytics-otlp = { path = "crates/bastyde-analytics-otlp", version = "0.5.0" }
bastyde-widgets = { path = "crates/bastyde-widgets", version = "0.5.0" }
bastyde-charts = { path = "crates/bastyde-charts", version = "0.5.0" }
bastyde-scene = { path = "crates/bastyde-scene", version = "0.5.0" }
bastyde-i18n = { path = "crates/bastyde-i18n", version = "0.5.0" }
bastyde-i18n-macros = { path = "crates/bastyde-i18n-macros", version = "0.5.0" }
cargo-bastyde-fmt = { path = "crates/cargo-bastyde-fmt", version = "0.5.0" }
bastyde-fmt = { path = "crates/bastyde-fmt", version = "0.5.0" }
bastyde-fmt-lsp = { path = "crates/bastyde-fmt-lsp", version = "0.5.0" }
bastyde-parse = { path = "crates/bastyde-parse", version = "0.5.0" }
bastyde-macros = { path = "crates/bastyde-macros", version = "0.5.0" }
bastyde-text = { path = "crates/bastyde-text", version = "0.5.0" }
bastyde-render = { path = "crates/bastyde-render", version = "0.5.0" }
bastyde-platform = { path = "crates/bastyde-platform", version = "0.5.0" }
bastyde-app = { path = "crates/bastyde-app", version = "0.5.0" }
bastyde-async = { path = "crates/bastyde-async", version = "0.5.0" }
bastyde-tokio = { path = "crates/bastyde-tokio", version = "0.5.0" }
bastyde-async-std = { path = "crates/bastyde-async-std", version = "0.5.0" }
bastyde-inspector = { path = "crates/bastyde-inspector", version = "0.5.0" }
bastyde-resources = { path = "crates/bastyde-resources", version = "0.5.0" }
bastyde = { path = "crates/bastyde", version = "0.5.0" }
bastyde-preview = { path = "crates/bastyde-preview", version = "0.5.0" }
bastyde-preview-ui = { path = "crates/bastyde-preview-ui", version = "0.5.0" }
bastyde-theme-material3 = { path = "crates/bastyde-theme-material3", version = "0.5.0" }
bastyde-theme-macos = { path = "crates/bastyde-theme-macos", version = "0.5.0" }
bastyde-theme-fluent = { path = "crates/bastyde-theme-fluent", version = "0.5.0" }

# gRPC proto crate — lives in a sibling repo at `../bastyde-collector-proto`
# so the wire-format spec has its own version stream (and the
# `bastyde-collector` server can consume it without needing the entire
# bastyde checkout). Path-dep into the sibling for now; promote to a
# git-rev / crates.io dep once the schema stabilises. The only bastyde
# consumer (`bastyde-analytics-bastyde`) owns its own tonic / prost / tokio
# versions since no other framework crate uses them.
bastyde-collector-proto = { path = "../bastyde-collector-proto", version = "0.1.0" }
bastyde-analytics-bastyde = { path = "crates/bastyde-analytics-bastyde", version = "0.2.0" }
bastyde-telemetry-codegen = { path = "crates/bastyde-telemetry-codegen", version = "0.5.0" }


[profile.release]
lto = "fat"
panic = "abort"
# `strip = true` (equivalent to `strip = "symbols"`) triggers a heisenbug
# under the combo `lto = "fat" + codegen-units = 1` on macOS-aarch64
# where the binary makes a 192 MB MALLOC_LARGE allocation at startup
# that is never used and only freed back to the malloc cache (visible
# as `MALLOC_LARGE (empty)` in vmmap). Measured on simple-button:
# strip = true   → 396 MB resident, 366 MB in two MALLOC_LARGE regions
# strip = "debuginfo" → 29 MB resident, 0 MALLOC_LARGE
# The bug is heisen — any debug-info change suppresses it, so the
# offending allocation site can't be symbolicated. `"debuginfo"` keeps
# the Rust function symbol table (sub-MB cost) while still removing
# DWARF, and side-steps the codegen pathology entirely.
strip = "debuginfo"
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = false
debug = true
lto = false
