[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
repository = "https://github.com/jacquetc/fern-ui"

[workspace.dependencies]
# Shared dependency versions
accesskit = "0.24.0"
tiny-skia = "0.12.0"
wgpu = "29.0.1"
winit = "0.30"
fluent-bundle = "0.16.0"
serde = { version = "1", features = ["derive"] }

# Internal crates
fern-tokens = { path = "crates/fern-tokens", version = "0.1.0" }
fern-canvas = { path = "crates/fern-canvas", version = "0.1.0" }
fern-core = { path = "crates/fern-core", version = "0.1.0" }
fern-data = { path = "crates/fern-data", version = "0.1.0" }
fern-widgets = { path = "crates/fern-widgets", version = "0.1.0" }
fern-i18n = { path = "crates/fern-i18n", version = "0.1.0" }
fern-text = { path = "crates/fern-text", version = "0.1.0" }
fern-render = { path = "crates/fern-render", version = "0.1.0" }
fern-platform = { path = "crates/fern-platform", version = "0.1.0" }
fern-app = { path = "crates/fern-app", version = "0.1.0" }
fern-ui = { path = "crates/fern-ui", version = "0.1.0" }


[profile.release]
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = false
debug = true
lto = false