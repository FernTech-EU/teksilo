[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
repository = "https://github.com/jacquetc/fern-ui"

[workspace.dependencies]
# Shared dependency versions
accesskit = "0.24.0"
tiny-skia = "0.12.0"
wgpu = "29.0.1"
winit = "0.30"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
redb = "4"
arboard = { version = "3.4", features = ["wayland-data-control"] }
open = "5"
roxmltree = "0.20"
png = "0.17"
image-webp = "0.2"
inventory = "0.3"
# Date/time. Used by Calendar / DateEdit / TimeEdit / DateTimeEdit. `jiff`
# is the modern BurntSushi-authored crate with a bundled IANA tz database.
# Default features enable tzdb + tz-system so `Zoned::now()` resolves
# the user's local "today" from the OS.
jiff = "0.1"
text-document = { path = "../text-document/crates/public_api" }
text-typeset = { path = "../text-typeset" }

# Internal crates
fern-tokens = { path = "crates/fern-tokens", version = "0.1.0" }
fern-canvas = { path = "crates/fern-canvas", version = "0.1.0" }
fern-core = { path = "crates/fern-core", version = "0.1.0" }
fern-data = { path = "crates/fern-data", version = "0.1.0" }
fern-settings = { path = "crates/fern-settings", version = "0.1.0" }
fern-telemetry = { path = "crates/fern-telemetry", version = "0.1.0" }
fern-analytics-plausible = { path = "crates/fern-analytics-plausible", version = "0.1.0" }
fern-analytics-otlp = { path = "crates/fern-analytics-otlp", version = "0.1.0" }
fern-widgets = { path = "crates/fern-widgets", version = "0.1.0" }
fern-charts = { path = "crates/fern-charts", version = "0.1.0" }
fern-scene = { path = "crates/fern-scene", version = "0.1.0" }
fern-i18n = { path = "crates/fern-i18n", version = "0.1.0" }
fern-i18n-macros = { path = "crates/fern-i18n-macros", version = "0.1.0" }
cargo-fern-fmt = { path = "crates/cargo-fern-fmt", version = "0.1.0" }
fern-fmt = { path = "crates/fern-fmt", version = "0.1.0" }
fern-fmt-lsp = { path = "crates/fern-fmt-lsp", version = "0.1.0" }
fern-parse = { path = "crates/fern-parse", version = "0.1.0" }
fern-ui-macros = { path = "crates/fern-ui-macros", version = "0.1.0" }
fern-text = { path = "crates/fern-text", version = "0.1.0" }
fern-render = { path = "crates/fern-render", version = "0.1.0" }
fern-platform = { path = "crates/fern-platform", version = "0.1.0" }
fern-app = { path = "crates/fern-app", version = "0.1.0" }
fern-inspector = { path = "crates/fern-inspector", version = "0.1.0" }
fern-resources = { path = "crates/fern-resources", version = "0.1.0" }
fern-ui = { path = "crates/fern-ui", version = "0.1.0" }
fern-preview = { path = "crates/fern-preview", version = "0.1.0" }
fern-preview-ui = { path = "crates/fern-preview-ui", version = "0.1.0" }

# gRPC proto crate — path dep so the location is centralized; the
# adapter that consumes it (fern-analytics-fern) owns its own
# tonic/prost/tokio versions in its own Cargo.toml since no other
# framework crate uses them.
fern-collector-proto = { path = "../fern-collector/crates/fern-collector-proto" }
fern-analytics-fern = { path = "crates/fern-analytics-fern", version = "0.1.0" }
fern-telemetry-codegen = { path = "crates/fern-telemetry-codegen", version = "0.1.0" }


[profile.release]
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = false
debug = true
lto = false