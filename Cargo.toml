[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/*",
]
# `teksilo-analytics-native` builds protobuf-src from source (transitively
# via `teksilo-collector-proto`), which needs a system `cmake` + C++
# toolchain. It's opt-in and only consumed by the `telemetry-teksilo`
# example, so excluding both keeps a default `cargo build`/`cargo test`
# working without that toolchain. Build them explicitly with
# `-p teksilo-analytics-native` (and
# `--manifest-path examples/telemetry_teksilo/Cargo.toml`) when cmake is
# available.
#
# `teksilo-collector-proto` itself lives in a sibling repo at
# `../teksilo-collector-proto` — its wire-format version stream is
# decoupled from this workspace's release version.
exclude = [
    "crates/teksilo-analytics-native",
    "examples/telemetry_teksilo",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license-file = "LICENSE"
publish = true
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
repository = "https://github.com/ferntech-eu/teksilo"

[workspace.dependencies]
# Shared dependency versions
accesskit = "0.24.1"
accesskit_consumer = "0.38.0"
tiny-skia = "0.12.0"
wgpu = "30.0.0"
# Minimal blocking executor, used only to drive `wgpu`'s adapter/device
# futures to completion on threads that have no async runtime (window
# creation, offscreen screenshot + PNG export paths). Pinned here rather
# than per-crate because five crates need it and the versions had drifted.
pollster = "1.0.1"
winit = "0.30"
# Windows platform bindings. Only consumed by `teksilo-platform` (target-gated to
# `cfg(target_os = "windows")`), but the version is pinned here per the workspace
# dependency convention; the crate selects its Win32 feature modules locally.
# `windows-core` is a *direct* dep there because the `#[implement]` COM macro emits
# a crate-root `::windows_core` path. Both pinned to 0.62 to unify with the
# windows-core 0.62 that accesskit_winit pulls in transitively.
windows = "0.62"
windows-core = "0.62"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
notify = "8.2.0"
# Advisory (fcntl/flock) cross-platform file locking, used by
# `teksilo-settings`'s opt-in shared (cross-process) `SettingsFile` mode.
# `fs2` is small, dependency-light, and has been the de-facto standard for
# this exact use case (Cargo itself has used it for the same purpose) for
# years; we only need `lock_exclusive`/`unlock`, a tiny stable surface
# that hasn't needed to change, so its low maintenance churn is a
# feature here, not a risk.
fs2 = "0.4"
intl-memoizer = "0.5"
icu_decimal = "2"
icu_datetime = "2"
icu_calendar = "2"
icu_locale_core = "2"
icu_experimental = { version = "0.5", features = ["compiled_data"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
etcetera = "0.11"
tempfile = "3"
# Test-only: property-based testing. `cargo-fuzz` needs a nightly toolchain
# (libfuzzer-sys links against compiler-rt's fuzzing runtime), which isn't a
# guaranteed CI dependency; proptest gives the same "never panics on weird
# input" coverage plus shrinking, on stable. Matches the convention already
# used in the sibling `text-typeset` / `text-document` repos. Never a
# production dependency — `[dev-dependencies]` only.
proptest = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
serde_json = "1"
redb = "4.1"
arboard = { version = "3.6", features = ["wayland-data-control"] }
open = "5.3"
quick-xml = "0.41.0"
png = "0.18"
image-webp = "0.2"
# JPEG decode for user-supplied images. Already in the tree via `image`/`resvg`/
# `tiff`, so naming it directly costs no additional crate.
zune-jpeg = "0.5"
zune-core = "0.5"
inventory = "0.3"
bytemuck = { version = "1", features = ["derive"] }
# Date/time. Used by Calendar / DateEdit / TimeEdit / DateTimeEdit. `jiff`
# is the modern BurntSushi-authored crate with a bundled IANA tz database.
# Default features enable tzdb + tz-system so `Zoned::now()` resolves
# the user's local "today" from the OS.
jiff = "0.2"
text-document = { path = "../text-document/crates/public_api", version = "1.9.3" }
text-typeset = { path = "../text-typeset", version = "1.8.1" }

# Terminal engine (consumed only by the opt-in `teksilo-terminal` crate,
# feature-gated so a default workspace build never pulls them). `portable-pty`
# is WezTerm's cross-platform pseudo-terminal (ConPTY on Windows, openpty on
# Unix); `alacritty_terminal` is Alacritty's standalone VT parser + grid +
# scrollback model. Both are permissive-licensed (MIT / Apache-2.0), pure Rust,
# and MPL-2.0-compatible. Pinned here per the workspace dependency convention.
portable-pty = "0.9"
alacritty_terminal = "0.26"

# Internal crates
teksilo-tokens = { path = "crates/teksilo-tokens", version = "0.7.0" }
teksilo-canvas = { path = "crates/teksilo-canvas", version = "0.7.0" }
teksilo-core = { path = "crates/teksilo-core", version = "0.7.0" }
teksilo-data = { path = "crates/teksilo-data", version = "0.7.0" }
teksilo-settings = { path = "crates/teksilo-settings", version = "0.7.0" }
teksilo-telemetry = { path = "crates/teksilo-telemetry", version = "0.7.0" }
teksilo-analytics-plausible = { path = "crates/teksilo-analytics-plausible", version = "0.7.0" }
teksilo-analytics-otlp = { path = "crates/teksilo-analytics-otlp", version = "0.7.0" }
teksilo-widgets = { path = "crates/teksilo-widgets", version = "0.7.0" }
teksilo-charts = { path = "crates/teksilo-charts", version = "0.7.0" }
teksilo-scene = { path = "crates/teksilo-scene", version = "0.7.0" }
teksilo-i18n = { path = "crates/teksilo-i18n", version = "0.7.0" }
teksilo-i18n-macros = { path = "crates/teksilo-i18n-macros", version = "0.7.0" }
cargo-teksilo-fmt = { path = "crates/cargo-teksilo-fmt", version = "0.7.0" }
teksilo-fmt = { path = "crates/teksilo-fmt", version = "0.7.0" }
teksilo-fmt-lsp = { path = "crates/teksilo-fmt-lsp", version = "0.7.0" }
teksilo-parse = { path = "crates/teksilo-parse", version = "0.7.0" }
teksilo-macros = { path = "crates/teksilo-macros", version = "0.7.0" }
teksilo-text = { path = "crates/teksilo-text", version = "0.7.0" }
teksilo-render = { path = "crates/teksilo-render", version = "0.7.0" }
teksilo-platform = { path = "crates/teksilo-platform", version = "0.7.0" }
teksilo-app = { path = "crates/teksilo-app", version = "0.7.0" }
teksilo-async = { path = "crates/teksilo-async", version = "0.7.0" }
teksilo-tokio = { path = "crates/teksilo-tokio", version = "0.7.0" }
teksilo-async-std = { path = "crates/teksilo-async-std", version = "0.7.0" }
teksilo-inspector = { path = "crates/teksilo-inspector", version = "0.7.0" }
teksilo-resources = { path = "crates/teksilo-resources", version = "0.7.0" }
teksilo-webview = { path = "crates/teksilo-webview", version = "0.7.0" }
teksilo-terminal = { path = "crates/teksilo-terminal", version = "0.7.0" }
teksilo-automation = { path = "crates/teksilo-automation", version = "0.7.0" }
teksilo-automation-mcp = { path = "crates/teksilo-automation-mcp", version = "0.7.0" }
teksilo = { path = "crates/teksilo", version = "0.7.0" }
teksilo-preview = { path = "crates/teksilo-preview", version = "0.7.0" }
teksilo-preview-ui = { path = "crates/teksilo-preview-ui", version = "0.7.0" }
teksilo-theme-material3 = { path = "crates/teksilo-theme-material3", version = "0.7.0" }
teksilo-theme-macos = { path = "crates/teksilo-theme-macos", version = "0.7.0" }
teksilo-theme-fluent = { path = "crates/teksilo-theme-fluent", version = "0.7.0" }

# gRPC proto crate — lives in a sibling repo at `../teksilo-collector-proto`
# so the wire-format spec has its own version stream (and the
# `teksilo-collector` server can consume it without needing the entire
# teksilo checkout). Path-dep into the sibling for now; promote to a
# git-rev / crates.io dep once the schema stabilises. The only teksilo
# consumer (`teksilo-analytics-native`) owns its own tonic / prost / tokio
# versions since no other framework crate uses them.
teksilo-collector-proto = { path = "../teksilo-collector-proto", version = "0.1.0" }
teksilo-analytics-native = { path = "crates/teksilo-analytics-native", version = "0.7.0" }
teksilo-telemetry-codegen = { path = "crates/teksilo-telemetry-codegen", version = "0.7.0" }


[profile.release]
lto = "fat"
panic = "abort"
# `strip = true` (equivalent to `strip = "symbols"`) triggers a heisenbug
# under the combo `lto = "fat" + codegen-units = 1` on macOS-aarch64
# where the binary makes a 192 MB MALLOC_LARGE allocation at startup
# that is never used and only freed back to the malloc cache (visible
# as `MALLOC_LARGE (empty)` in vmmap). Measured on simple-button:
# strip = true   → 396 MB resident, 366 MB in two MALLOC_LARGE regions
# strip = "debuginfo" → 29 MB resident, 0 MALLOC_LARGE
# The bug is heisen — any debug-info change suppresses it, so the
# offending allocation site can't be symbolicated. `"debuginfo"` keeps
# the Rust function symbol table (sub-MB cost) while still removing
# DWARF, and side-steps the codegen pathology entirely.
strip = "debuginfo"
codegen-units = 1

[profile.profiling]
inherits = "release"
strip = false
debug = true
lto = false
