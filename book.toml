# mdBook configuration for the Teksilo documentation site.
#
# The book sources ARE the existing `docs/` tree: `docs/SUMMARY.md` is the table
# of contents, and the catalogs (docs/widgets/, docs/data-collections/,
# docs/settings/, docs/scene/) are generated from source by
# `tools/extract_widget_api.py --catalog-all`. The generated pages are
# committed; regenerate them when a type's documentation changes.
#
# Build:  python3 tools/extract_widget_api.py --catalog-all --api-dir target/doc && mdbook build
# Serve:  mdbook serve --open

[book]
title = "Teksilo Documentation"
authors = ["Cyril Jacquet"]
description = "Reference and design documentation for the Teksilo pure-Rust GUI framework."
# Engineering records live outside this source tree in engineering/docs/.
# Internal screen-reader findings stay in docs/a11y/ but are omitted from
# docs/SUMMARY.md, so mdBook does not publish them.
src = "docs"
language = "en"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ferntech-eu/teksilo"
edit-url-template = "https://github.com/ferntech-eu/teksilo/edit/main/{path}"
# The site is served at the domain root (teksilo-docs.pages.dev), not a subpath.
site-url = "/"
no-section-label = false
# The API catalogs' function names in FernTech teal; the generated pages
# themselves stay plain Markdown.
additional-css = ["docs/assets/teksilo-catalog.css"]
additional-js = ["docs/assets/teksilo-catalog.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
