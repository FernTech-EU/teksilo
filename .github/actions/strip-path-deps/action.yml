name: 'Strip external path dependencies'
description: 'Remove ../ (external sibling) path attributes from Cargo.toml so they resolve from crates.io, leaving internal crates/ paths intact'

runs:
  using: 'composite'
  steps:
    - name: Strip external path dependencies from Cargo.toml
      shell: bash
      run: |
        # Only strip path attrs whose value starts with `..` (external siblings:
        # text-typeset, text-document, bastyde-collector-proto). Internal crates
        # live under `crates/...` and MUST keep their path — they are unpublished
        # (workspace is publish = false), so a crates.io fallback would fail.
        sed -i.bak -E \
          -e 's#, *path = "\.\.[^"]*"##g' \
          -e 's#path = "\.\.[^"]*", *##g' \
          Cargo.toml
        rm -f Cargo.toml.bak
        echo "External deps after strip:"
        grep -nE 'text-(typeset|document)' Cargo.toml
