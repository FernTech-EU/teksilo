name: CI

on:
  pull_request:
    paths:
      - "**"
      - "!/*.md"
      - "!/docs/**"
      - "!/LICENSE"
      - "!/README*"
  push:
    branches:
      - main
    paths:
      - "**"
      - "!/*.md"
      - "!/docs/**"
      - "!/LICENSE"
      - "!/README*"
  schedule:
    - cron: "3 3 3 * *"
  # Called by the Release workflow. `cargo publish` is irreversible and a
  # burned version cannot be reused, so a tag runs the whole matrix on its own
  # commit rather than trusting that main was green when the tag was cut.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full DWARF (`debuginfo=2`, the dev-profile default) is the largest single
  # thing in a `target/` dir, and no job here reads it: a panic backtrace needs
  # function names and file:line, which is precisely what line tables carry.
  # `profile.test` inherits `profile.dev`, so this one variable covers every
  # test binary as well. It lives here and not in Cargo.toml so that a local
  # `cargo test` keeps the full debug info a debugger actually wants.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ci:
    name: CI
    needs: [test-linux, test-x11, test-cross, test-automation, check, rustfmt, clippy, docs, spdx]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test-linux.result }}" != "success" ]] || \
             [[ "${{ needs.test-x11.result }}" != "success" ]] || \
             [[ "${{ needs.test-cross.result }}" != "success" ]] || \
             [[ "${{ needs.test-automation.result }}" != "success" ]] || \
             [[ "${{ needs.check.result }}" != "success" ]] || \
             [[ "${{ needs.rustfmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.spdx.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"

  # Linux runs first; Windows/macOS only start once Linux passes (saves runner
  # minutes on a Linux failure and gives a deterministic order).
  test-linux:
    name: Test (linux)
    runs-on: ubuntu-latest
    # A warm run finishes in ~10 minutes; a cold one (no cache for this ref,
    # which is every tag's first run) compiles the workspace twice over — once
    # for the tests and once for the trybuild fixtures — and overran 30.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # This is the only job that builds every test binary in the workspace,
      # and it is the one that ran the runner's root filesystem out of space at
      # v0.12.0. Runs before apt, so the package install has room too.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      # This job runs the trybuild fixtures, so it grows a `target/tests` that
      # trips an un-awaited probe in rust-cache's post step; see the action.
      - name: Rust-cache nested-target probe dir
        uses: ./.github/actions/rust-cache-probe-dir

      # `cargo test --no-run` rather than `cargo check --all-targets`: a check
      # pass compiles the whole dependency graph to rmeta and then throws it
      # away, because the Test step needs rlibs and recompiles every bit of it
      # — a second copy of the graph on a filesystem that just ran out of
      # room. Still its own step so a compile failure names itself instead of
      # reading as a test failure.
      #
      # The one thing `--all-targets` covered here and this does not is
      # teksilo-core's two bench targets (`cargo test` does not build them).
      # The `check (debug)` and `check (release)` jobs build those on both
      # profiles, so a bench that stops compiling is still caught — by a job
      # that does nothing else, which is a clearer signal than this one.
      - name: Build
        run: cargo test --workspace --no-run

      - name: Test
        run: cargo test --workspace

      # cargo-teksilo's `semantic` feature (search embeddings) pulls in
      # fastembed -> ort (ONNX Runtime) plus the onig_sys / esaxx-rs C/C++ sys
      # crates. If that build ever breaks on some platform, `cargo install
      # cargo-teksilo --no-default-features` must still produce a working
      # tool — so that escape hatch is built and tested here rather than
      # merely assumed to work. `cargo test --workspace` above already
      # exercises the default (`semantic`-on) build; the two steps below are
      # kept explicit anyway so that guarantee doesn't rely on inferring it
      # from a workspace-wide run.
      - name: Build cargo-teksilo (--no-default-features)
        run: cargo build -p cargo-teksilo --no-default-features

      - name: Test cargo-teksilo (--no-default-features)
        run: cargo test -p cargo-teksilo --no-default-features

      - name: Build cargo-teksilo (semantic feature)
        run: cargo build -p cargo-teksilo

      - name: Test cargo-teksilo (semantic feature)
        run: cargo test -p cargo-teksilo

  # The X11 backends (XDND drag-and-drop, the EWMH title-bar probe) can only be
  # exercised against a real X server: there is no in-process X server or
  # protocol double for Rust, so their `#[ignore]`d tests are invisible to the
  # ordinary `cargo test` above. Openbox is deliberately a *different, minimal*
  # EWMH implementation from the KWin/Mutter desktops these are developed
  # against — it is the only cross-window-manager data point in the matrix.
  test-x11:
    name: Test (X11)
    needs: test-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install X server, window manager and software GPU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb openbox x11-utils
          # teksilo-app's loop tests open a real window, which means wgpu has to
          # find an adapter. The runner has no GPU, so Mesa's software
          # implementations are the adapter: lavapipe for the Vulkan backend,
          # llvmpipe for the GL fallback. Without these the test panics at
          # window creation rather than skipping, which is the failure mode we
          # want — a missing adapter must not read as a pass.
          sudo apt-get install --no-install-recommends -y \
            mesa-vulkan-drivers libgl1-mesa-dri libegl-mesa0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          # Restore only. `test-linux` owns the `linux` key and has already
          # saved it by the time this job runs, and `Automation (linux)` shares
          # it too — two jobs writing one key means one of them loses the race
          # ("Unable to reserve cache with key ..."). Saving from here would
          # also overwrite a whole-workspace cache with the two crates this job
          # builds.
          save-if: false

      # A single x11rb in the graph. Teksilo and winit both depend on it, and a
      # version fork would silently double the X11 code in every binary and make
      # any future type shared across the boundary fail to compile.
      - name: Assert a single x11rb version
        run: |
          versions=$(cargo tree --workspace -i x11rb --depth 0 2>/dev/null \
                     | grep -oE '^x11rb v[0-9.]+' | sort -u)
          echo "$versions"
          [ "$(echo "$versions" | wc -l)" -eq 1 ] || {
            echo "::error::x11rb has forked into multiple versions"; exit 1; }

      - name: Build tests
        run: |
          cargo test -p teksilo-platform --no-run
          cargo test -p teksilo-app --lib --no-run

      # Xvfb alone has NO window manager, which would turn every EWMH assertion
      # into a silent pass rather than a failure — openbox is what makes the
      # title-bar probe meaningful. The probe test asserts
      # `_NET_SUPPORTING_WM_CHECK` resolves *before* asserting anything else, so
      # a WM that failed to start fails the job loudly.
      - name: Run X11 tests (Xvfb + openbox)
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 &
          for _ in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
          openbox &
          sleep 1
          xprop -root _NET_SUPPORTING_WM_CHECK
          # WAYLAND_DISPLAY must be empty so Teksilo's window-system detection
          # (which mirrors winit's precedence) resolves to X11.
          WAYLAND_DISPLAY= cargo test -p teksilo-platform -- --ignored --test-threads=1

      # The other half of what needs a display: `teksilo-app`'s
      # `app::winit_loop_tests`, which builds a real winit event loop off the
      # main thread and hands `TeksiloAppHandler`'s own callbacks hand-built
      # events. It is the only test in the workspace that witnesses the winit
      # call sites at all — see that module's docs for what it can and cannot
      # decide. Separate step from the platform one so a failure names which
      # half broke; the X server and openbox started above are still running.
      - name: Run app event-loop tests (Xvfb + openbox)
        run: |
          export DISPLAY=:99
          xdpyinfo -display :99 >/dev/null
          WAYLAND_DISPLAY= cargo test -p teksilo-app --lib -- --ignored --test-threads=1

  test-cross:
    name: Test (${{ matrix.name }})
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: mac
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # This job builds the whole workspace, so it owns the write for its
      # platform's key; the Automation job on the same platform shares that key
      # and only restores.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}

      # This job runs the trybuild fixtures, so it grows a `target/tests` that
      # trips an un-awaited probe in rust-cache's post step; see the action.
      - name: Rust-cache nested-target probe dir
        uses: ./.github/actions/rust-cache-probe-dir

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Same escape-hatch guard as test-linux, on the other two OSes — see the
      # comment there for why both configurations are built and tested
      # explicitly rather than just the workspace-wide default.
      - name: Build cargo-teksilo (--no-default-features)
        run: cargo build -p cargo-teksilo --no-default-features

      - name: Test cargo-teksilo (--no-default-features)
        run: cargo test -p cargo-teksilo --no-default-features

      - name: Build cargo-teksilo (semantic feature)
        run: cargo build -p cargo-teksilo

      - name: Test cargo-teksilo (semantic feature)
        run: cargo test -p cargo-teksilo

  # The automation bridge is the one subsystem whose *transport* differs per OS
  # — a Unix socket on Linux/macOS, a named pipe on Windows — so it is the one
  # that most needs to be *run* on each of them rather than merely compiled.
  # `cargo test --workspace` in test-cross already covers the wire, transport
  # and stdio-smoke tests; the stdio smoke — which carries the touch gate — is
  # re-run here under its own name so that gate is legible on the job that owns
  # synthetic input. What this job adds beyond a test harness is a live app with
  # a real window driven over the bridge end to end, and the canary proving the
  # bridge stays out of a release build.
  test-automation:
    name: Automation (${{ matrix.name }})
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: mac
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-linux-deps

      # Xvfb gives the window a display; `mesa-vulkan-drivers` gives it a GPU.
      # The runner image has neither a GPU nor a Vulkan ICD, and its only
      # OpenGL adapter cannot present to an Xvfb surface — wgpu reports
      # `NotFound { active_backends: GL, incompatible_surface_backends: GL }`
      # and window creation panics before the bridge is ever exercised. The
      # package supplies lavapipe (llvmpipe), a CPU rasterizer that does
      # support X11 WSI, which is the Linux counterpart of the DX12 WARP device
      # that makes this job pass on a GPU-less Windows runner.
      - name: Install X server and a software GPU
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb x11-utils mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          # Restore only. This shares a key with the Test job that builds the
          # whole workspace on the same platform, and two jobs cannot write one
          # key: whichever finishes first wins and the other logs "Unable to
          # reserve cache with key ...". A key per job is not the answer either
          # — the repo already sits at GitHub's 10 GB cache ceiling, so three
          # more entries would only buy evictions.
          save-if: false

      - name: Build the bridge smoke and the MCP server
        run: cargo build -p automation_bridge_smoke -p teksilo-automation-mcp

      # The touch gate: a scripted multi-touch gesture, driven over real MCP
      # stdio against the headless server, reproducing the arbitration answer
      # documented in docs/events-and-gestures.md. It rides `cargo test
      # --workspace` in test-linux and test-cross too, but it is named here so
      # the gate is legible on the job that owns synthetic input — and so a
      # failure says "the touch surface broke" rather than "some workspace test
      # failed". Headless: no window, no GPU, no display, and the server's only
      # clock is the simulated one, so the result is the same on all three.
      - name: MCP touch gate (headless stdio)
        run: cargo test -p teksilo-automation-mcp --test stdio_smoke

      # Drives a real window over the real endpoint: snapshot_tree →
      # invoke_action → snapshot_tree → the two input no-regression checks
      # (scroll injects a Programmatic sample, drag_node injects a mouse
      # pointer) → screenshot. Exits 0 on success, 1 on any failure, so the job
      # result is the assertion. Every runner here has at least a software
      # adapter — lavapipe above, DX12 WARP on Windows, Metal on macOS — so the
      # screenshot is expected to really capture. `TEKSILO_SMOKE_REQUIRE_GPU` is
      # what makes that an assertion rather than a hope: without it the smoke
      # treats GPU_UNAVAILABLE as a skip and the job would go green having never
      # exercised the capture path, so an adapter that stopped loading would
      # retire this job's whole reason to exist without anyone noticing.
      - name: Live-bridge smoke (Unix socket)
        if: matrix.os != 'windows-latest'
        env:
          TEKSILO_SMOKE_REQUIRE_GPU: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export DISPLAY=:99
            Xvfb :99 -screen 0 1280x1024x24 &
            for _ in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done
            # The loop above falls through on failure. Without this the window
            # fails later inside wgpu and the log blames the wrong thing.
            xdpyinfo -display :99 >/dev/null 2>&1 || {
              echo "::error::Xvfb never came up on :99"; exit 1; }
          fi
          cargo run -p automation_bridge_smoke

      # The curated probe examples drive real teksilo demo apps end to end
      # through the harness (`cargo teksilo probe`'s worked examples), so —
      # like the Live-bridge smoke step above — they need a live display.
      # Unlike that step, some of what they exercise depends on window-manager
      # behaviour (e.g. modal-window focus return), so this mirrors test-x11's
      # Xvfb + openbox setup rather than the bare Xvfb the smoke step uses; it
      # runs on its own display (:98) so it can't race whatever the smoke step
      # above left running on :99.
      - name: Probe harness curated examples (Xvfb + openbox)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 25
        run: |
          examples_dir=crates/cargo-teksilo/embedded/probe/examples
          # Not a "skip if missing" guard: these examples are committed, and a
          # checkout without them is a broken checkout, not a reason to pass.
          if [ ! -d "$examples_dir" ]; then
            echo "::error::$examples_dir is missing — the curated probe examples are committed and must be present"
            exit 1
          fi

          # The probes drive these three demo apps' own debug binaries — the
          # automation bridge is `#[cfg(debug_assertions)]`, so it must be a
          # `cargo build`, not `cargo test`'s hashed test-binary output, which
          # `teksilo_probe.resolve.app_binary` does not look under.
          cargo build -p data-collections -p dialogs-and-popovers -p rich-text-editor

          sudo apt-get install --no-install-recommends -y openbox

          export DISPLAY=:98
          Xvfb :98 -screen 0 1280x1024x24 &
          for _ in $(seq 1 50); do xdpyinfo -display :98 >/dev/null 2>&1 && break; sleep 0.2; done
          openbox &
          sleep 1

          # `teksilo_probe.resolve.mcp_binary` checks $TEKSILO_MCP_BIN before
          # $PATH; the client built above ("Build the bridge smoke and the MCP
          # server") isn't on $PATH, so this is what lets the probes find it
          # without triggering a `cargo install`.
          export TEKSILO_MCP_BIN="$PWD/target/debug/teksilo-automation-mcp"

          # Each probe's own `report.error` path prints the tail of the
          # launched app's log before exiting (see examples/README.md — a
          # probe never swallows why the app it launched didn't behave), so a
          # failing example's own stdout already carries the app log; no
          # separate dump is needed beyond letting that output reach the step
          # log. Exit 1 means the probe itself couldn't run; exit 2 means it
          # ran and a check came back false — both fail this step.
          status=0
          for example in "$examples_dir"/example_*.py; do
            echo "::group::$(basename "$example")"
            timeout 300 python3 "$example"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::$example failed (exit $rc)"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Live-bridge smoke (named pipe)
        if: matrix.os == 'windows-latest'
        env:
          TEKSILO_SMOKE_REQUIRE_GPU: "1"
        run: cargo run -p automation_bridge_smoke

      # The bridge is debug-gated, so a release binary with the feature on must
      # contain none of it. The banner string only exists inside the gated
      # `spawn_bridge_thread`, which makes it a precise canary.
      #
      # Both directions are checked. Absent-from-release is the assertion; but a
      # grep for a string that no longer exists anywhere passes for the wrong
      # reason, so the debug build is checked to still CONTAIN it. Without that,
      # renaming the banner would retire the canary silently and nobody would
      # learn until a release shipped a live bridge.
      #
      # The subject is the smoke example because it is the cheapest binary that
      # actually wires the bridge. Note it references `TEKSILO_AUTOMATION_TOKEN`
      # in its own *ungated* `main`, so that string is legitimately present in
      # its release build — only the gated banner is a valid canary here.
      - name: Release canary — no bridge in a release build
        shell: bash
        run: |
          banner="teksilo-automation: bridge endpoint"
          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"

          cargo build -p automation_bridge_smoke
          debug_bin="target/debug/automation_bridge_smoke$suffix"
          if ! grep -qa "$banner" "$debug_bin"; then
            echo "::error::the canary string is absent from the DEBUG build — it no longer proves anything; update it to match the bridge's banner"
            exit 1
          fi

          cargo build --release -p automation_bridge_smoke
          release_bin="target/release/automation_bridge_smoke$suffix"
          if grep -qa "$banner" "$release_bin"; then
            echo "::error::the automation bridge leaked into a release build"
            exit 1
          fi
          echo "canary ok: present in debug, absent from release"

  check:
    name: Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            rust: stable
            flags: ""
          - name: release
            rust: stable
            flags: "--release"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ matrix.name }}
      - name: Check
        run: cargo check --workspace --all-targets ${{ matrix.flags }}

      # The guards below are profile-independent (they don't touch debug vs
      # release at all), so they run once — on the `debug` leg — rather than
      # duplicating identical work across both matrix legs.

      - name: teksilo-corpus staleness guard
        if: matrix.name == 'debug'
        run: python3 tools/build_corpus.py --check

      # The corpus is built in two passes: build_corpus.py chunks the sources,
      # then `cargo teksilo build-vectors` encodes them. The guard above catches
      # a stale *index*; this one catches a forgotten *second pass*, which is
      # otherwise silent — `cargo teksilo search` just falls back to lexical and
      # says so, and nobody reads that line in CI.
      #
      # It does NOT re-encode. Re-running build-vectors here would download a
      # 128 MB model and build ONNX Runtime on every push, and it would not
      # catch anything this does not: build_corpus.py carries embeddings forward
      # keyed on each chunk's text hash, so a chunk whose source changed is
      # written with `embedding: null`. "Every chunk has a vector" is therefore
      # a freshness check, not just a completeness one — a stale vector cannot
      # survive a regeneration.
      - name: teksilo-corpus vector guard
        if: matrix.name == 'debug'
        run: python3 tools/build_corpus.py --check-vectors

      # crates.io enforces a 10 MB package limit, and teksilo-corpus carries
      # committed generated data (the retrieval corpus) — the one thing in
      # this workspace that could grow past that limit without anyone
      # noticing at review time. `--no-verify` skips packaging's own
      # build-to-verify step (redundant: `cargo check`/test-linux already
      # build this crate) and just measures the tarball; `--allow-dirty`
      # because a CI checkout can have gitignored build artifacts sitting
      # next to tracked files.
      #
      # NOTE: a `cargo teksilo build-vectors` step (added in a concurrent
      # change) writes dense embeddings INTO
      # crates/teksilo-corpus/corpus/index.json, growing it further. If that
      # ever pushes this guard's number close to the ceiling, widen the
      # margin rather than deleting the guard.
      - name: teksilo-corpus package size guard
        if: matrix.name == 'debug'
        run: |
          out=$(cargo package -p teksilo-corpus --no-verify --allow-dirty 2>&1)
          echo "$out"
          size=$(echo "$out" | grep -oE 'Packaged [0-9]+ files, [0-9.]+[KMG]iB' | grep -oE '[0-9.]+[KMG]iB$')
          if [ -z "$size" ]; then
            echo "::error::could not find the 'Packaged N files, X.YMiB' line in cargo package output"
            exit 1
          fi
          mib=$(echo "$size" | awk '
            { s = $0
              if (s ~ /KiB$/) { v = s; sub(/KiB$/, "", v); printf "%.4f", v / 1024 }
              else if (s ~ /MiB$/) { v = s; sub(/MiB$/, "", v); printf "%.4f", v }
              else if (s ~ /GiB$/) { v = s; sub(/GiB$/, "", v); printf "%.4f", v * 1024 }
            }')
          echo "teksilo-corpus package size: ${mib} MiB (guard: 9 MiB; crates.io limit is 10 MB)"
          awk -v m="$mib" 'BEGIN { exit !(m > 9) }' && {
            echo "::error::teksilo-corpus package size ${mib} MiB exceeds the 9 MiB guard"
            exit 1
          }
          echo "package size within guard"

      # cargo-teksilo embeds two copies of files that also live elsewhere in
      # the repo, so an app that only depends on the `teksilo` crate — not
      # this checkout — still gets them. Nothing else enforces the copies
      # stay identical; this replaces a hand-run `cp` a previous skill
      # depended on.
      - name: Embedded-copy identity — extract_widget_api.py
        if: matrix.name == 'debug'
        run: |
          diff -q tools/extract_widget_api.py crates/cargo-teksilo/embedded/extract_widget_api.py || {
            echo "::error::crates/cargo-teksilo/embedded/extract_widget_api.py has drifted from tools/extract_widget_api.py — fix with: cp tools/extract_widget_api.py crates/cargo-teksilo/embedded/extract_widget_api.py"
            exit 1
          }

      - name: Embedded-copy identity — teksilo skill
        if: matrix.name == 'debug'
        run: |
          diff -r .claude/skills/teksilo crates/cargo-teksilo/embedded/skill || {
            echo "::error::crates/cargo-teksilo/embedded/skill has drifted from .claude/skills/teksilo — fix with: cp -r .claude/skills/teksilo/. crates/cargo-teksilo/embedded/skill/"
            exit 1
          }

      # Stdlib-only unit tests for the probe harness's Python library — no
      # display and no running app needed. The three curated examples that DO
      # drive a real app live in test-automation (Linux only, which already
      # has a display set up).
      - name: Probe harness unit tests
        if: matrix.name == 'debug'
        run: |
          cd crates/cargo-teksilo/embedded/probe
          python3 -m unittest discover -s tests -t .

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

  rustfmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `teksu!` bodies are macro input, so rustfmt leaves them alone. The
      # DSL's own formatter is what keeps them consistent, and it is what
      # renders the one dangerous mis-parse visible: a trailing comma before a
      # child (`padding: 8.0,` then `Leaf`) reads the child as a second
      # argument, and the formatter prints it back on one line where the
      # reading is obvious in the diff.
      - name: Check teksu! formatting
        run: cargo run -q -p cargo-teksilo-fmt -- --check crates examples

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings -A deprecated

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The checker derives each file's copyright year from its first
          # commit (`git log --diff-filter=A`); a shallow clone would lose
          # that history and report every file as outdated.
          fetch-depth: 0

      - name: Check SPDX headers
        run: python3 tools/check_spdx_headers.py --check
