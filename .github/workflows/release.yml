name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # Also match pre-release tags like v1.0.0-beta.1

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate on `publish`. A crates.io version cannot be unpublished or reused,
  # so the tag re-runs the *entire* CI matrix (Linux, X11 under Xvfb, Windows,
  # macOS, the automation bridge, clippy, docs, SPDX headers) against its own
  # commit rather than assuming main was green when the tag was cut. A tag can
  # be moved or re-cut for free; a publish cannot.
  #
  # `validate` deliberately does NOT wait for this: its publish-order and
  # tag-vs-version checks are seconds of stdlib Python, and their whole value
  # is failing before anyone has spent half an hour on a matrix.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Validate the release before publishing it. No binary-artifact build —
  # Teksilo is a framework, not a shippable binary — so this workflow validates
  # the tag, publishes the workspace to crates.io, and cuts a GitHub release.
  #
  # Nothing is compiled here: the `ci` job above already ran the whole test
  # matrix on this commit, so both checks below are manifest-level and the job
  # answers in under a minute.
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Stdlib-only Python, no toolchain needed, so it runs first and fails a
      # bad graph in seconds. It exits non-zero on a cycle in the normal/build
      # dependency graph, and on a dev-dependency cycle that leaves crates
      # unorderable. A verified `cargo publish` compiles dev-dependencies, so
      # both are real. `cargo publish --workspace` finds either one only
      # partway through, after earlier crates are already on the registry and
      # the version is burned; three crates failed that way during 0.9.0.
      - name: Check crate publish order
        run: |
          echo "::group::Internal crate dependency report"
          python3 tools/check_release_order.py && rc=0 || rc=$?
          echo "::endgroup::"
          if [[ $rc -ne 0 ]]; then
            echo "::error::Release-blocking dependency cycle. Fix the graph before tagging: a partial publish cannot be undone, and the version cannot be reused."
            exit $rc
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo metadata` reads every member manifest, so a path dependency on a
      # sibling repo that is not checked out here fails the read outright —
      # even with `--no-deps`, which resolves nothing.
      - name: Strip path dependencies
        uses: ./.github/actions/strip-path-deps

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "teksilo") | .version')
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            echo "::error::Update the workspace version in Cargo.toml before tagging."
            exit 1
          fi
          echo "Version validated: $CARGO_VERSION"

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: [ci, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: release
    permissions:
      id-token: write
    # Skip for pre-release tags
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # `cargo publish` verify-builds every crate, which needs the same X11 /
      # Wayland / keyboard libraries the test jobs install.
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish` resolves the whole workspace before it packages
      # anything, which must resolve workspace path deps. Sibling repos
      # (text-document, text-typeset) are not checked out on the runner.
      # This rewrites Cargo.toml, hence the `--allow-dirty` below.
      - name: Strip path dependencies
        uses: ./.github/actions/strip-path-deps

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Auth for trusted publishing on crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # `cargo publish --workspace` is NOT resumable: it aborts on the first
        # crate version already on the index, and it can die mid-run with an
        # internal error while crates.io's index catches up after an upload
        # (rust-lang/cargo#17028). To survive both, each attempt excludes the
        # versions already published and retries, so every attempt makes
        # forward progress until nothing is left to publish.
        run: |
          set -uo pipefail

          # True if <name>@<version> is already on the crates.io sparse index.
          crate_published() {
            local name="$1" version="$2" len=${#1} prefix
            if   (( len <= 2 )); then prefix="$len"
            elif (( len == 3 )); then prefix="3/${name:0:1}"
            else prefix="${name:0:2}/${name:2:2}"; fi
            curl -sf "https://index.crates.io/${prefix}/${name}" 2>/dev/null \
              | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null 2>&1
          }

          mapfile -t CRATES < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"')

          for attempt in 1 2 3 4 5; do
            excludes=()
            pending=0
            for entry in "${CRATES[@]}"; do
              name=${entry% *}; version=${entry#* }
              if crate_published "$name" "$version"; then
                excludes+=(--exclude "$name")
              else
                pending=$((pending + 1))
              fi
            done

            if (( pending == 0 )); then
              echo "All crates already published."
              exit 0
            fi

            echo "::group::cargo publish (attempt $attempt, $pending pending)"
            if cargo publish --workspace --allow-dirty "${excludes[@]}"; then
              echo "::endgroup::"
              echo "Publish complete."
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; waiting for the index to settle..."
            sleep 60
          done

          echo "::error::cargo publish still failing after 5 attempts."
          exit 1

  # Create the GitHub release.
  release:
    name: Create Release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -f CHANGELOG.md ]]; then
            # Stop at the next H2 of any shape — the file ends with an
            # unbracketed "## Earlier history" that would otherwise be
            # swept into the notes of the oldest release listed.
            sed -n "/^## \[${VERSION}\]/,/^## /p" CHANGELOG.md | sed '1d;$d' > release_notes.md
            if [[ ! -s release_notes.md ]]; then
              echo "No changelog entry found for version ${VERSION}" > release_notes.md
            fi
          else
            echo "Release ${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
