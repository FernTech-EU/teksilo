# Build the documentation site and publish it to Cloudflare Pages
# (https://bastyde.pages.dev). The site has two layers:
#   * mdBook — the curated guides under docs/ plus a generated Widget Catalog,
#     at the site root.
#   * rustdoc — the deep API reference under /api/ (catalog pages deep-link in).
#
# Modelled on qleany's mdbook-gh-pages.yml (same Cloudflare Pages deploy via
# wrangler-action + CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets), with
# the Bastyde-specific steps added: regenerate the catalog from widget source and
# build the rustdoc API reference.

name: Deploy documentation to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "docs/**"
      - "tools/extract_widget_api.py"
      - "book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.4.52"
  BASE_URL: "https://bastyde.pages.dev"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for sitemap lastmod dates

      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Strip path dependencies
        uses: ./.github/actions/strip-path-deps

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the rustdoc API reference
        # bastyde-widgets (its module paths bastyde_widgets/<module>/ are what the
        # catalog pages deep-link to) plus the peer crates the guides reference:
        # bastyde-data (reactive data models), bastyde-settings (persistence), and
        # bastyde-scene (the scene viewport). --no-deps keeps the deployed file
        # count well under Cloudflare Pages' 20,000-files-per-deployment limit.
        # Built BEFORE the catalog so --api-dir can verify each deep-link.
        run: cargo doc -p bastyde-widgets -p bastyde-data -p bastyde-settings -p bastyde-scene --no-deps

      - name: Generate the catalog pages (widgets + data + settings + scene)
        run: python3 tools/extract_widget_api.py --catalog-all --api-dir target/doc

      - name: Fix internal doc links for the book
        # Rewrite the guides' repo-relative source links (../crates/…) to
        # absolute GitHub URLs and neutralize rustdoc intra-doc links, so nothing
        # 404s inside the rendered book. Mutates the runner's checkout only.
        run: python3 tools/fix_book_links.py docs --repo-url "${{ github.server_url }}/${{ github.repository }}" --branch "${{ github.ref_name }}"

      - name: Build the book (mdBook)
        run: mdbook build

      - name: Assemble the site (book + /api)
        run: |
          cp -r target/doc book/api
          printf '<meta http-equiv="refresh" content="0; url=bastyde_widgets/index.html">' > book/api/index.html

      - name: Generate sitemap.xml
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > book/sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> book/sitemap.xml
          # Only the mdBook pages (skip the large rustdoc tree under api/).
          find book -name '*.html' -not -path 'book/api/*' \
            -not -name 'print.html' -not -name '404.html' | sort | while read -r file; do
            path="${file#book/}"
            base="${path%.html}"
            src_file="docs/${base}.md"
            if [ -f "$src_file" ]; then
              lastmod=$(git log -1 --format="%aI" -- "$src_file")
            else
              lastmod=$(git log -1 --format="%aI")
            fi
            echo "  <url>" >> book/sitemap.xml
            echo "    <loc>${BASE_URL}/${path}</loc>" >> book/sitemap.xml
            echo "    <lastmod>${lastmod:-$(git log -1 --format="%aI")}</lastmod>" >> book/sitemap.xml
            echo "    <priority>0.80</priority>" >> book/sitemap.xml
            echo "  </url>" >> book/sitemap.xml
          done
          echo '</urlset>' >> book/sitemap.xml

      - name: Add robots.txt
        run: |
          cat > book/robots.txt << EOF
          User-agent: *
          Allow: /

          Sitemap: ${BASE_URL}/sitemap.xml
          EOF

      - name: Generate llms.txt
        run: |
          cat > book/llms.txt << EOF
          # Bastyde

          > A pure-Rust GUI framework for serious desktop applications: a retained widget tree with SwiftUI-style layout negotiation, AccessKit accessibility, reactive Signal/Prop state, and a wgpu renderer. ~56 widgets + ~21 layout primitives, a four-tier theming system, i18n, data models, and persistence.

          ## Documentation

          - [Introduction](${BASE_URL}/introduction.html): Overview and where to start

          ### Architecture & roadmap

          - [Architecture](${BASE_URL}/architecture.html): Framework internals reference
          - [Property-based testing](${BASE_URL}/property-testing.html): proptest conventions and safe-run protocol

          ### Authoring widgets

          - [Widgets overview](${BASE_URL}/widgets-overview.html): Every shipped widget, categorized
          - [Layout primitives](${BASE_URL}/layout-primitives.html): HStack/VStack/ZStack, Grid, Wrap, size wrappers
          - [Events & gestures](${BASE_URL}/events-and-gestures.html): Dispatch, attached handlers, gestures
          - [Styling system](${BASE_URL}/styling-system.html): Tokens → variants → recipes → style protocols
          - [Reactive theme](${BASE_URL}/reactive-theme.html): Live theme swaps without a rebuild
          - [Animation](${BASE_URL}/animation.html): Signal-tween, shader-quad, and per-frame-effect motion
          - [Idle & animation](${BASE_URL}/idle-and-animation.html): Visibility-aware scheduling, idle fps
          - [Accessibility overrides](${BASE_URL}/accessibility-overrides.html): Builder-level .access_* modifiers
          - [Global text scale](${BASE_URL}/text-scale.html): App-wide "grow all text" accessibility setting
          - [Window-active appearance](${BASE_URL}/window-activation.html): Inactive-window dimming and desaturation
          - [Internationalization](${BASE_URL}/i18n.html): Fluent-rs runtime, locale-aware formatting
          - [Grid view](${BASE_URL}/grid-view.html): Virtualized 2D tile grid

          ### bati! DSL & formatting

          - [bati! macro reference](${BASE_URL}/bati-macro-reference.html): Surface language and desugaring cheat sheet
          - [bati! language spec](${BASE_URL}/bati-language-spec-v3.html): Design spec with worked translations
          - [bastyde-fmt](${BASE_URL}/bastyde-fmt.html): bati! source formatter
          - [bastyde-fmt in VS Code](${BASE_URL}/bastyde-fmt-vscode.html): Editor integration

          ### Input, navigation, chrome

          - [Shortcuts, intents & actions](${BASE_URL}/shortcut-intent-action.html): The input-to-behaviour pipeline
          - [Tooltips](${BASE_URL}/tooltips.html): Plain, rich, and composite tooltip tiers
          - [Toasts & notifications](${BASE_URL}/toast.html): Stackable notifications + persistent log
          - [Native menus](${BASE_URL}/native-menu.html): In-window MenuBar + native OS menu bar
          - [WebView](${BASE_URL}/web-view.html): Embedded HTML/web-content widget
          - [Drag & drop](${BASE_URL}/drag-and-drop.html): In-app and OS drag-and-drop
          - [Multi-window](${BASE_URL}/multi-window.html): Window management, modal dialogs, custom title bars
          - [Title bar](${BASE_URL}/title-bar.html): Custom chrome across platforms
          - [Toolbar](${BASE_URL}/toolbar.html): Overflow-aware command bar

          ### Data, persistence, telemetry

          - [Data models](${BASE_URL}/data-models.html): ListModel/TreeModel/SelectionModel and projections
          - [Data sources](${BASE_URL}/data-source.html): External/lazy-loaded data sources
          - [Settings & persistence](${BASE_URL}/settings.html): SettingsStore, SettingsFile, MruList, window state
          - [Telemetry](${BASE_URL}/telemetry.html): Privacy-respecting product analytics

          ### Async & concurrency

          - [Async executor](${BASE_URL}/async.html): Opt-in main-thread async executor

          ### Specialized widgets

          - [Splitter](${BASE_URL}/splitter.html): N-pane resizable split container
          - [Docking layout](${BASE_URL}/docking.html): VS Code-style dockable IDE shell
          - [Table & tree-table views](${BASE_URL}/table-view.html): Virtualized multi-column data views
          - [Code & plain-text editors](${BASE_URL}/code-editor.html): Gutter, highlighting, completion
          - [Log view (streaming)](${BASE_URL}/log-view.html): Read-only tail-following streaming view
          - [Tab widget](${BASE_URL}/tab-widget.html): TabBar/TabWidget with overflow and drag-reorder
          - [Font picker](${BASE_URL}/font-picker.html): Installed-font browser with live preview
          - [Charts](${BASE_URL}/charts.html): BarChart/LineChart/PieChart
          - [Scene viewport](${BASE_URL}/bastyde-scene.html): Pannable/zoomable canvas with magnetism
          - [Scene accessibility](${BASE_URL}/bastyde-scene-a11y.html): Accessibility support for the scene viewport

          ### Visuals & resources

          - [Icons & resources](${BASE_URL}/icons-and-resources.html): Resource embedding and icon usage

          ### Tooling

          - [Debug inspector](${BASE_URL}/inspector.html): In-app introspection panel
          - [Automation MCP](${BASE_URL}/automation-mcp.html): Drive a Bastyde app via the Model Context Protocol

          ### Catalogs

          - [Widget Catalog](${BASE_URL}/widgets/index.html): Per-widget discovery pages (abilities + example + API link)
          - [Data Collections catalog](${BASE_URL}/data-collections/index.html): Reactive data-model API reference
          - [Settings catalog](${BASE_URL}/settings/index.html): Settings/persistence API reference
          - [Scene catalog](${BASE_URL}/scene/index.html): Scene-viewport API reference

          ### API reference

          - [API reference](${BASE_URL}/api/bastyde_widgets/index.html): rustdoc for every public item
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: book

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: book
          path: book

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy book --project-name=bastyde
